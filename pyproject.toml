[project]
name = "hangtu"
version = "0.1.0"
description = "Plots and analyses for geotechnical engineers, in US or SI units; AGS4 and DIGGS data ingest planned"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Konner Horton", email = "konnerhorton@gmail.com" }]
keywords = [
    "geotechnical",
    "geotechnical engineering",
    "ground investigation",
    "soil mechanics",
    "borehole",
    "SPT",
    "AGS",
    "AGS4",
    "DIGGS",
    "matplotlib",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "pandas>=2.1.1,<3",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pint>=0.24.4",
    "pyyaml>=6.0.1",
    "python-ags4>=1.2.0",
    "scipy>=1.16.0",
]

[project.urls]
Homepage = "https://github.com/konnerhorton/hangtu"
Documentation = "https://konnerhorton.github.io/hangtu/"
Source = "https://github.com/konnerhorton/hangtu"
Issues = "https://github.com/konnerhorton/hangtu/issues"
Specification = "https://github.com/konnerhorton/hangtu/blob/main/SPEC.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.17",
    "hypothesis>=6.100",
    "pytest-xdist>=3.6.1",
]
# The docs site (docs/work/docs-site.md). Zensical is alpha, so it is pinned exactly.
docs = ["zensical==0.0.70", "mkdocstrings-python>=2.0.9"]

[build-system]
requires = ["uv_build>=0.9.9,<0.10"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"

# Code blocks in the docs are hand-aligned sketches, not code to format.
[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "D"]
# Greek symbols appear in axis labels (registry `label`), e.g. "Bulk unit weight, γ",
# in messages naming effective stress and friction angle (σ′v, φ′), and in beta's
# parameters, α and β (ht.stats.fit()), and in a crosstab's title, "rows × columns".
allowed-confusables = ["α", "γ", "ρ", "σ", "φ", "′", "×"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
# Page examples are a few lines a user copies, not modules.
"docs/site/examples/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = [
    "error",
    # matplotlib < 3.10.7 calls pyparsing APIs that newer pyparsing deprecates.
    # Deprecated keyword arguments are reported from matplotlib or from inside
    # pyparsing itself; hangtu doesn't use pyparsing directly.
    "ignore:.* deprecated - use :DeprecationWarning:matplotlib",
    "ignore:.* argument is deprecated, use :DeprecationWarning:matplotlib",
    "ignore:.* argument is deprecated, use :DeprecationWarning:pyparsing",
    # pytest.warns re-emits the warnings it didn't match with module "warnings",
    # so the module filters above miss them inside a pytest.warns block.
    "ignore:.* deprecated - use :DeprecationWarning:warnings",
    "ignore:.* argument is deprecated, use :DeprecationWarning:warnings",
]
