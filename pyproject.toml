[project]
name = "ags-kit"
version = "0.1.0.dev0"
description = "Tools for working with AGS4 geotechnical data: ingest, QC, query, analyze and plot"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pandas>=2.1.1,<3",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pint>=0.24.4",
    "pyyaml>=6.0.1",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.17", "hypothesis>=6.100"]

[build-system]
requires = ["uv_build>=0.9.9,<0.10"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"

# Code blocks in the docs are hand-aligned sketches, not code to format.
[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "D"]
# Greek symbols appear in axis labels (registry `label`), e.g. "Bulk unit weight, γ".
allowed-confusables = ["γ"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = [
    "error",
    # matplotlib < 3.10.7 calls pyparsing APIs that newer pyparsing deprecates.
    "ignore:.* deprecated - use :DeprecationWarning:matplotlib",
]
