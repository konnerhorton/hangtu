# The docs site (docs/work/docs-site.md, Spec §2). Build with:
#   uv run python docs/prepare_site.py && uv run zensical build --clean --strict

[project]
site_name = "hangtu"
site_url = "https://konnerhorton.github.io/hangtu/"
site_description = "Plots and analyses for geotechnical engineers, in US or SI units, with AGS4 data ingest and checks"
repo_url = "https://github.com/konnerhorton/hangtu"
docs_dir = "docs/site"
site_dir = "build/site"
extra_javascript = [
  "javascripts/mathjax.js",
  "https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js",
]
nav = [
  { "Home" = "index.md" },
  { "Install" = "install.md" },
  { "Getting started" = [
    "getting-started/csv.md",
    "getting-started/ags.md",
  ] },
  { "Guides" = [
    "guides/units.md",
    "guides/templates.md",
    "guides/ags-and-qc.md",
    "guides/datasets.md",
    "guides/spt.md",
    "guides/judgments.md",
    "guides/correlations.md",
  ] },
  { "Plots" = [
    "plots/index.md",
    "plots/profile.md",
    "plots/spt-profile.md",
    "plots/water-content-profile.md",
    "plots/plasticity-chart.md",
    "plots/grain-size.md",
    "plots/spt-histogram.md",
    "plots/geology-unit-comparison.md",
  ] },
  { "Parameters" = [
    "parameters/01-unit-weight-and-vertical-stress.md",
    "parameters/04-drained-shear-strength-soil.md",
    "parameters/05-undrained-shear-strength.md",
    "parameters/06-preconsolidation-and-compressibility.md",
    "parameters/07-at-rest-earth-pressure.md",
    "parameters/08-elastic-stiffness-soil.md",
    "parameters/10-small-strain-stiffness.md",
  ] },
  { "Reference" = [
    "reference/project.md",
    "reference/plot.md",
    "reference/analysis.md",
    "reference/correlations.md",
    "reference/data.md",
    "reference/errors.md",
    "reference/columns.md",
  ] },
]

[project.theme]
language = "en"
logo = "img/generated/logo.svg"
favicon = "img/generated/favicon.svg"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.smartsymbols = {}
pymdownx.snippets.base_path = [
  "docs/site/examples",
  "docs/site/img/generated",
  "examples",
]
pymdownx.snippets.check_paths = true
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "numpy"
show_source = false
show_root_heading = true
show_signature_annotations = true
separate_signature = true
members_order = "source"
filters = ["!^_"]
