# Column registry: the single source of friendly column names (SPEC §10.3).
# Schema and rules: docs/plots/P00-framework.md §5. Quantity kinds: P00 §4.1.
#
# Per column:
#   description  one line, shown by ht.columns()
#   type         number | text | bool
#   quantity     quantity kind (numbers only); drives unit conversion and labels
#   scale        ratio | interval   (numbers only; interval = no meaningful zero, so no CoV, SPEC §5)
#   label        axis label text without units, "Name, symbol" (numbers only)
#   ags          AGS source heading(s), or "derived: ..." (Phase 2)
#   used_by      plot specs that read the column
#   agsi         AGSi code (later; omitted for now)
#   statistics   how ht.stats functions treat a flag or source column (docs/work/m15a-describe.md):
#                  role    at_least    the value is a lower bound (included, counted)
#                          qualifier   "<" or ">" on the row's value: an upper or lower bound
#                          non_plastic the value is NP: left out, counted
#                          assumed     the value is assumed: left out unless asked for, counted
#                          source      rows with different values here come from different sources
#                  values  the value columns the flag applies to (all, if omitted)
#                  when    for a text flag, the values that set it (else True sets it)
# Status of the Batch 1 entries beyond P01: provisional until each plot spec is written.
#
# fields: names used only in overlay tables (P01 §8), such as a range's low and
# high. They aren't data columns, so ht.columns() leaves them out, but templates
# may use them. Per field: description, type.

templates:
  # ht.template(name): empty DataFrame with these columns, in this order.
  # spt, atterberg, grain_size and permeability are their dataset's columns
  # without those only hangtu produces (SPEC §2.6; tests/test_registry.py).
  profile:        [loca_id, depth, elevation, ground_level, geology_unit, source]   # plus the user's value column
  permeability:   [loca_id, ground_level, depth, depth_top, depth_base, depth_basis, elevation, hydraulic_conductivity, qualifier, source, test_type, geology_unit, soil_class, geology_description]
  strength:       [loca_id, depth, ground_level, elevation, undrained_shear_strength, qualifier, test_type, geology_unit]
  index:          [loca_id, depth, ground_level, elevation, water_content, bulk_unit_weight, geology_unit]
  spt:            [loca_id, ground_level, depth, depth_basis, elevation, spt_n, spt_n60, energy_ratio, spt_refusal, spt_penetration, remarks, geology_unit, soil_class, geology_description]
  atterberg:      [loca_id, specimen_id, sample_reference, specimen_reference, ground_level, depth, depth_basis, elevation, depth_top, depth_base, liquid_limit, plastic_limit, plasticity_index, non_plastic, water_content, geology_unit, soil_class, geology_description]
  grain_size:     [loca_id, specimen_id, sample_reference, specimen_reference, ground_level, depth, depth_basis, elevation, particle_size, percent_passing, qualifier, geology_unit, soil_class, geology_description]
  density:        [loca_id, specimen_id, sample_reference, specimen_reference, ground_level, depth, depth_basis, elevation, bulk_unit_weight, dry_unit_weight, water_content, particle_density, particle_density_assumed, sample_condition, stabilizer_content, source, test_type, geology_unit, soil_class, geology_description]
  particle_density: [loca_id, specimen_id, sample_reference, specimen_reference, ground_level, depth, depth_basis, elevation, particle_density, particle_density_assumed, test_type, geology_unit, soil_class, geology_description]
  # One row per stage at failure; p.triaxial() adds the principal stresses and their basis (M11 a).
  triaxial:       [loca_id, specimen_id, sample_reference, specimen_reference, ground_level, depth, depth_basis, elevation, test_type, test_stage, multistage_test, sample_condition, failure_criterion, water_content, bulk_unit_weight, dry_unit_weight, void_ratio, effective_consolidation_stress, back_pressure, pore_pressure_parameter_b, cell_pressure, deviator_stress_at_failure, pore_pressure_at_failure, axial_strain_at_failure, volumetric_strain_at_failure, reported_effective_friction_angle, reported_effective_cohesion, test_remarks, remarks, geology_unit, soil_class, geology_description]
  # A log per hole (ht.analysis.vertical_stress); p.stratigraphy() adds source_line.
  stratigraphy:   [loca_id, depth_top, depth_base, geology_unit, soil_class, geology_description]
  # Overlays (P01 §8): fill in one depth or elevation pair and leave the other blank.
  strata:         [geology_unit, depth_top, depth_base, elevation_top, elevation_base]
  ranges:         [low, high, label, source, depth_top, depth_base, elevation_top, elevation_base]
  design_lines:   [label, depth, elevation, value]
  # Baseline ranges per geology unit (P07 §8): one row per unit and property.
  baseline:       [geology_unit, property, low, central, high, source]
  # Plasticity chart regions (P04 §8): one row per vertex, in order around each polygon.
  plasticity_regions: [label, liquid_limit, plasticity_index]
  # Clogging diagram zones (P17 §8): one row per vertex, zones from the lowest potential to the highest.
  clogging_zones: [label, plasticity_index, consistency_index]
  # Grain size envelopes (P05 §8): one row per size, with rows sharing a label making one band.
  envelopes:      [label, particle_size, low, high]

fields:
  low:
    description: Lower bound of a published range, in the plotted value's units
    type: number
  high:
    description: Upper bound of a published range, in the plotted value's units
    type: number
  label:
    description: Text drawn beside an overlay
    type: text
  value:
    description: Value of a design line at a depth or elevation, in the plotted value's units
    type: number
  property:
    description: The value column a baseline row applies to, e.g. water_content
    type: text
  central:
    description: Central value of a baseline range (p50, mean or typical, as the report states)
    type: number

columns:

  # --- Location and depth -----------------------------------------------------
  loca_id:
    description: Exploratory hole ID
    type: text
    ags: [LOCA.LOCA_ID]
    used_by: [P01, P02, P03, P04, P05, P06, P07]
  location_type:
    description: Type of exploratory hole, as the code the file gives (CP, RC, ...)
    type: text
    ags: [LOCA.LOCA_TYPE]
    used_by: []
  easting:
    description: Easting of the hole, in the file's grid
    type: number
    quantity: length
    scale: interval
    label: Easting
    ags: [LOCA.LOCA_NATE]
    used_by: []
  northing:
    description: Northing of the hole, in the file's grid
    type: number
    quantity: length
    scale: interval
    label: Northing
    ags: [LOCA.LOCA_NATN]
    used_by: []
  latitude:
    description: Latitude of the hole, in decimal degrees
    type: number
    quantity: angle
    scale: interval
    label: Latitude
    ags: [LOCA.LOCA_LAT]
    used_by: []
  longitude:
    description: Longitude of the hole, in decimal degrees
    type: number
    quantity: angle
    scale: interval
    label: Longitude
    ags: [LOCA.LOCA_LON]
    used_by: []
  final_depth:
    description: Final depth of the hole
    type: number
    quantity: length
    scale: ratio
    label: Final depth
    ags: [LOCA.LOCA_FDEP]
    used_by: []
  specimen_id:
    description: Specimen identifier, unique in the project (a project's specimen key)
    type: text
    ags: ["derived: SAMP_TOP, SAMP_REF, SAMP_TYPE, SAMP_ID, SPEC_REF, SPEC_DPTH"]
    used_by: [P04, P05, P06]
  water_content_specimen_id:
    description: The specimen (specimen_id) whose water content a sample's row uses, chosen by depth
    type: text
    ags: ["derived: datasets.md §6.6"]
    used_by: []
  atterberg_specimen_id:
    description: The specimen (specimen_id) whose Atterberg limits a sample's row uses, chosen by depth
    type: text
    ags: ["derived: datasets.md §6.6"]
    used_by: []
  grain_size_specimen_id:
    description: The specimen (specimen_id) whose grading a sample's row uses, chosen by depth
    type: text
    ags: ["derived: datasets.md §6.6"]
    used_by: []
  sample_reference:
    description: The sample a result comes from, as the file names it (SAMP_ID, else type and reference at its top)
    type: text
    ags: [SAMP.SAMP_ID, "derived: SAMP_TYPE, SAMP_REF, SAMP_TOP"]
    used_by: []
  specimen_reference:
    description: Specimen reference within its sample
    type: text
    ags: [SPEC_REF]
    used_by: []
  depth:
    description: Depth of the observation below ground level (the plotted point for interval tests)
    type: number
    quantity: length
    scale: ratio
    label: Depth
    ags: ["derived: SPEC §8.2"]
    used_by: [P01, P02, P03, P04, P05, P06, P07]
  depth_top:
    description: "Top of an interval: a tested zone or a geology layer"
    type: number
    quantity: length
    scale: ratio
    label: Depth to top
    ags: [FGHG.FGHG_TOP, IPRG.IPRG_TOP, SPEC_DPTH, GEOL.GEOL_TOP]
    used_by: [P01]
  depth_base:
    description: "Base of an interval: a tested zone or a geology layer"
    type: number
    quantity: length
    scale: ratio
    label: Depth to base
    ags: [FGHG.FGHG_BASE, IPRG.IPRG_BASE, SPEC_BASE, GEOL.GEOL_BASE]
    used_by: [P01]
  depth_basis:
    description: How depth was chosen (mid_drive, sample_mid, zone_mid, test_depth, ...)
    type: text
    ags: ["derived: SPEC §8.2"]
    used_by: []
  ground_level:
    description: Ground level at the hole
    type: number
    quantity: length
    scale: interval
    label: Ground level
    ags: [LOCA.LOCA_GL]
    used_by: [P01, P02, P06]
  elevation:
    description: Elevation of the observation (ground_level - depth)
    type: number
    quantity: length
    scale: interval
    label: Elevation
    ags: ["derived: LOCA_GL - depth"]
    used_by: [P01, P02, P06]
  elevation_top:
    description: Elevation of the top of an interval, e.g. a stratum in an idealized profile
    type: number
    quantity: length
    scale: interval
    label: Elevation of top
    ags: ["derived: LOCA_GL - top depth"]
    used_by: [P01]
  elevation_base:
    description: Elevation of the base of an interval
    type: number
    quantity: length
    scale: interval
    label: Elevation of base
    ags: ["derived: LOCA_GL - base depth"]
    used_by: [P01]

  # --- Grouping and flags -------------------------------------------------------
  geology_unit:
    description: Geology unit (colors every plot)
    type: text
    ags: ["derived: GEOL key or mapping file, SPEC §8.3"]
    used_by: [P01, P02, P03, P04, P05, P06, P07]
  geology_description:
    description: Description of the geology layer the result is in
    type: text
    ags: [GEOL.GEOL_DESC]
    used_by: []
  geology_code:
    description: Geology code as written in GEOL_GEOL, unmapped
    type: text
    ags: [GEOL.GEOL_GEOL]
    used_by: []
  geology_code_secondary:
    description: Second geology code as written in GEOL_GEO2, unmapped
    type: text
    ags: [GEOL.GEOL_GEO2]
    used_by: []
  legend_code:
    description: Legend code as written in GEOL_LEG, unmapped
    type: text
    ags: [GEOL.GEOL_LEG]
    used_by: []
  geology_formation:
    description: Formation as written in GEOL_FORM, unmapped
    type: text
    ags: [GEOL.GEOL_FORM]
    used_by: []
  bgs_lexicon_code:
    description: BGS Lexicon code as written in GEOL_BGS, unmapped
    type: text
    ags: [GEOL.GEOL_BGS]
    used_by: []
  soil_class:
    description: Cohesive / cohesionless class of the unit (categories TODO #3)
    type: text
    ags: ["derived: mapping file"]
    used_by: [P03]
  source:
    description: Where the value came from, e.g. lab or field
    type: text
    ags: ["derived: group of origin"]
    used_by: [P01, P07]
    statistics: {role: source}
  test_type:
    description: Test method, e.g. falling head, packer, UU, torvane
    type: text
    ags: [PTST.PTST_TYPE, FGHG.FGHG_TYPE, IPRG.IPRG_TYPE, LPDN.LPDN_TYPE, LDEN.LDEN_TYPE, IDEN.IDEN_TYPE, TREG.TREG_TYPE, TRIG.TRIG_TYPE]
    used_by: [P01]
    statistics: {role: source}
  remarks:
    description: Remarks the file gives for the record
    type: text
    ags: [LOCA.LOCA_REM, ISPT.ISPT_REM, TRET.TRET_REM, TRIT.TRIT_REM]
    used_by: []
  source_line:
    description: Line of the record in the AGS file, to check a value against the file
    type: number
    quantity: count
    scale: ratio
    label: Source line
    ags: ["derived: the record's line in the file"]
    used_by: []
  qualifier:
    description: '"<" or ">" when the true value is below or above the reported value; empty otherwise'
    type: text
    ags: ["derived: value flags LT / GT"]
    used_by: [P01, P07]
    statistics: {role: qualifier}

  # --- Properties (P01 presets; preset name = column name) ---------------------------------------------------
  hydraulic_conductivity:
    description: Hydraulic conductivity
    type: number
    quantity: hydraulic_conductivity
    scale: ratio
    label: Hydraulic conductivity, k
    ags: [PTST.PTST_K, FGHG.FGHG_IPRM, IPRG.IPRG_IPRM]
    used_by: [P01, P07]
  undrained_shear_strength:
    description: Undrained shear strength
    type: number
    quantity: stress
    scale: ratio
    label: Undrained shear strength, s_u
    ags: [TRIT.TRIT_CU, IVAN.IVAN_IVAN, LVAN.LVAN_VNPK]   # to verify against the 4.2 dictionary
    used_by: [P01, P07]
  water_content:
    description: Water (moisture) content
    type: number
    quantity: percent
    scale: ratio
    label: Water content, w
    ags: [LNMC.LNMC_MC, LDEN.LDEN_MC, IDEN.IDEN_MC, TRET.TRET_IMC, TRIT.TRIT_IMC]
    used_by: [P01, P06, P07]
  bulk_unit_weight:
    description: Bulk unit weight
    type: number
    quantity: unit_weight
    scale: ratio
    label: Bulk unit weight, γ
    ags: ["derived: LDEN.LDEN_BDEN × g", "derived: IDEN.IDEN_IDEN × g", "derived: TRET.TRET_BDEN × g", "derived: TRIT.TRIT_BDEN × g"]
    used_by: [P01, P07]
  saturated_unit_weight:
    description: Saturated unit weight, used below the water level
    type: number
    quantity: unit_weight
    scale: ratio
    label: Saturated unit weight, γ_sat
    ags: ["derived: the judgments file (SPEC §4)", "derived: ht.analysis.phase_relations()"]
    used_by: []
  dry_unit_weight:
    description: Dry unit weight, the weight of the solids per unit total volume
    type: number
    quantity: unit_weight
    scale: ratio
    label: Dry unit weight, γ_d
    ags: ["derived: LDEN.LDEN_DDEN × g", "derived: TRET.TRET_DDEN × g", "derived: TRIT.TRIT_DDEN × g", "derived: ht.analysis.phase_relations()"]
    used_by: []
  sample_condition:
    description: The specimen's condition as tested (UNDISTURBED, RECOMPACTED)
    type: text
    ags: [LDEN.LDEN_COND, TREG.TREG_COND, TRIG.TRIG_COND]
    used_by: []
  stabilizer_content:
    description: Stabilizer added to the ground before a field density test
    type: number
    quantity: percent
    scale: ratio
    label: Stabilizer content
    ags: [IDEN.IDEN_STAB]
    used_by: []
  particle_density:
    description: Density of the solid particles, rho_s (Gs = rho_s / rho_w, M14 b)
    type: number
    quantity: density
    scale: ratio
    label: Particle density, ρ_s
    ags: [LPDN.LPDN_PDEN]
    used_by: []
  particle_density_assumed:
    description: True if the file marked the particle density as assumed (#)
    type: bool
    ags: ["derived: value flag ASSUMED"]
    used_by: []
    statistics: {role: assumed, values: [particle_density]}
  particle_density_specimen_id:
    description: The LPDN specimen (its specimen_id) whose particle density p.density() joined
    type: text
    ags: ["derived: docs/data/datasets.md §6.8"]
    used_by: []
  # Phase relations (ht.analysis.phase_relations, M14 b).
  specific_gravity:
    description: Specific gravity of the solids, Gs = rho_s / rho_w
    type: number
    quantity: dimensionless
    scale: ratio
    label: Specific gravity, G_s
    ags: ["derived: ht.analysis.phase_relations()", "derived: the judgments file (SPEC §4)"]
    used_by: []
  specific_gravity_source:
    description: Where the row's Gs came from (measured, assumed, judgment)
    type: text
    ags: ["derived: ht.analysis.phase_relations()"]
    used_by: []
    statistics:
      role: assumed
      when: [assumed, judgment]
      values: [specific_gravity, void_ratio, porosity, degree_of_saturation, saturated_unit_weight]
  void_ratio:
    description: Void ratio, volume of voids / volume of solids (a specimen's initial, or from gamma, w and Gs)
    type: number
    quantity: dimensionless
    scale: ratio
    label: Void ratio, e
    ags: [TRET.TRET_IVR, "derived: ht.analysis.phase_relations()"]
    used_by: [P01, P07]
  porosity:
    description: Porosity, volume of voids / total volume
    type: number
    quantity: percent
    scale: ratio
    label: Porosity, n
    ags: ["derived: ht.analysis.phase_relations()"]
    used_by: [P01, P07]
  degree_of_saturation:
    description: Degree of saturation, volume of water / volume of voids
    type: number
    quantity: percent
    scale: ratio
    label: Degree of saturation, S
    ags: ["derived: ht.analysis.phase_relations()"]
    used_by: [P01, P07]
  oversaturated:
    description: True if the degree of saturation is above 100 % by more than the tolerance
    type: bool
    ags: ["derived: ht.analysis.phase_relations()"]
    used_by: []

  # --- Vertical stress (ht.analysis.vertical_stress, M13) --------------------------------
  total_vertical_stress:
    description: Total vertical stress from the unit weights through the log
    type: number
    quantity: stress
    scale: ratio
    label: Total vertical stress, σ_v0
    ags: ["derived: docs/work/m13a-judgments.md"]
    used_by: [P01]
  pore_pressure:
    description: In situ pore pressure (hydrostatic from the water level in M13)
    type: number
    quantity: stress
    scale: ratio
    label: Pore pressure, u_0
    ags: ["derived: docs/work/m13a-judgments.md"]
    used_by: [P01]
  effective_vertical_stress:
    description: Effective vertical stress, total less pore pressure
    type: number
    quantity: stress
    scale: ratio
    label: Effective vertical stress, σ′_v0
    ags: ["derived: docs/work/m13a-judgments.md"]
    used_by: [P01]

  # --- Strength (correlations from M13; measured values from W2) -----------------------
  effective_friction_angle:
    description: Effective (drained) friction angle, peak unless the source says otherwise
    type: number
    quantity: angle
    scale: ratio
    label: Effective friction angle, φ′
    ags: ["derived: docs/work/m13b1-spt-framework.md"]
    used_by: [P01]
  undrained_shear_strength_lower:
    description: Lower bound of an undrained shear strength given as a band, such as a correlation's
    type: number
    quantity: stress
    scale: ratio
    label: Undrained shear strength (lower), s_u
    ags: ["derived: docs/work/m13b2-spt-strength-history.md"]
    used_by: [P01]
  undrained_shear_strength_upper:
    description: Upper bound of an undrained shear strength given as a band; blank for an open band
    type: number
    quantity: stress
    scale: ratio
    label: Undrained shear strength (upper), s_u
    ags: ["derived: docs/work/m13b2-spt-strength-history.md"]
    used_by: [P01]

  # --- Stress history (correlations from M13; oedometer values from W2) ---------------
  preconsolidation_stress:
    description: Preconsolidation stress, the largest effective vertical stress the soil behaves as having carried
    type: number
    quantity: stress
    scale: ratio
    label: Preconsolidation stress, σ′p
    ags: ["derived: docs/work/m13b2-spt-strength-history.md"]
    used_by: [P01]
  overconsolidation_ratio:
    description: Overconsolidation ratio, preconsolidation stress over effective vertical stress
    type: number
    quantity: dimensionless
    scale: ratio
    label: Overconsolidation ratio, OCR
    ags: ["derived: docs/work/m13b2-spt-strength-history.md"]
    used_by: [P01]
  at_rest_earth_pressure_coefficient:
    description: At-rest earth pressure coefficient, horizontal over vertical effective stress
    type: number
    quantity: dimensionless
    scale: ratio
    label: At-rest earth pressure coefficient, K0
    ags: ["derived: docs/work/m13b2-spt-strength-history.md"]
    used_by: [P01]
  drained_youngs_modulus:
    description: Drained Young's modulus, a secant modulus at working strains, not the small-strain E0
    type: number
    quantity: modulus
    scale: ratio
    label: Drained Young's modulus, E′
    ags: ["derived: docs/work/m13b3-spt-stiffness.md"]
    used_by: [P01]
  shear_wave_velocity:
    description: Shear wave velocity, measured in situ or estimated
    type: number
    quantity: velocity
    scale: ratio
    label: Shear wave velocity, V_s
    ags: [ISTA.ISTA_WVL]   # where ISTA_WVTY gives a shear wave; the dataset is W5's
    used_by: [P01]

  # --- Correlations (ht.analysis.correlations, M13) ----------------------------------------
  correlation_name:
    description: The correlation an estimate came from, by its function's name
    type: text
    ags: ["derived: docs/work/m13b1-spt-framework.md"]
    used_by: [P01]
    statistics: {role: source}
  correlation_soil:
    description: The source's soil row a correlation's coefficient was taken from (soil=)
    type: text
    ags: ["derived: docs/work/m13b3-spt-stiffness.md"]
    used_by: [P01]
  correlation_input:
    description: The correlation an input came from, when a correlation read another's estimate
    type: text
    ags: ["derived: docs/work/m13b2-spt-strength-history.md"]
    used_by: [P01]
  correlation_note:
    description: "Why a correlation gave no estimate: not for this soil, soil type unknown, input blank, refusal, below range or above range"
    type: text
    ags: ["derived: docs/work/m13b1-spt-framework.md"]
    used_by: [P01]
  correlation_data_count:
    description: The number of data points a correlation's source fit it to (its n); blank when not stated
    type: number
    quantity: count
    scale: ratio
    label: Correlation's data points, n
    ags: ["derived: docs/work/m15b-correlation-statistics.md"]
    used_by: []
  correlation_r_squared:
    description: The coefficient of determination a correlation's source gives (its r²); blank when not stated
    type: number
    quantity: dimensionless
    scale: ratio
    label: Correlation's coefficient of determination, r²
    ags: ["derived: docs/work/m15b-correlation-statistics.md"]
    used_by: []
  correlation_scatter:
    description: A correlation's scatter as its source states it, or "Not stated."
    type: text
    ags: ["derived: docs/work/m15b-correlation-statistics.md"]
    used_by: []
  correlation_advice:
    description: "The source's advice on using a correlation, quoted with its citation, or hangtu's own marked \"hangtu:\""
    type: text
    ags: ["derived: docs/work/m15b-correlation-statistics.md"]
    used_by: []

  # --- SPT (P02, P03) ------------------------------------------------------------------
  spt_n:
    description: SPT N as reported
    type: number
    quantity: count
    scale: ratio
    label: SPT N
    ags: [ISPT.ISPT_NVAL]
    used_by: [P02, P03]
  spt_n_capped:
    description: min(N, spt_cap)
    type: number
    quantity: count
    scale: ratio
    label: SPT N (capped)
    ags: ["derived: docs/drafts/analysis.md §1"]
    used_by: [P02, P03]
  spt_n60:
    description: N corrected to 60% energy (N × ER / 60)
    type: number
    quantity: count
    scale: ratio
    label: SPT N60
    ags: ["derived: spt_n, energy_ratio"]
    used_by: [P02, P03]
  spt_overburden_correction:
    description: "Overburden correction to σ′v = 100 kPa, C_N (ht.analysis.spt_n1_60, by method)"
    type: number
    quantity: dimensionless
    scale: ratio
    label: Overburden correction, C_N
    ags: ["derived: effective_vertical_stress"]
    used_by: [P01]
  spt_n1_60:
    description: N60 corrected for overburden (N60 × C_N)
    type: number
    quantity: count
    scale: ratio
    label: SPT (N1)60
