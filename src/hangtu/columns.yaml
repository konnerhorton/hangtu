# Column registry: the single source of friendly column names (SPEC §10.3).
# Schema and rules: docs/plots/P00-framework.md §5. Quantity kinds: P00 §4.1.
#
# Per column:
#   description  one line, shown by ht.columns()
#   type         number | text | bool
#   quantity     quantity kind (numbers only); drives unit conversion and labels
#   scale        ratio | interval   (numbers only; interval = no meaningful zero, so no CoV, SPEC §5)
#   label        axis label text without units, "Name, symbol" (numbers only)
#   ags          AGS source heading(s), or "derived: ..." (Phase 2)
#   used_by      plot functions that read the column, as plot.<name>
#   agsi         AGSi code (later; omitted for now)
#   statistics   how ht.stats functions treat a flag or source column (SPEC §5, the input rules):
#                  role    at_least    the value is a lower bound (included, counted)
#                          qualifier   "<" or ">" on the row's value: an upper or lower bound
#                          non_plastic the value is NP: left out, counted
#                          assumed     the value is assumed: left out unless asked for, counted
#                          source      rows with different values here come from different sources
#                  values  the value columns the flag applies to (all, if omitted)
#                  when    for a text flag, the values that set it (else True sets it)
#                  replaces  for a qualifier with values: the generic qualifier column it replaces for
#                          them (a second value on the row); without it, both are read (SPEC §5)
# Status of the Batch 1 entries beyond P01: provisional until each plot spec is written.
#
# fields: names used only in overlay tables (P01 §8), such as a range's low and
# high. They aren't data columns, so ht.columns() leaves them out, but templates
# may use them. Per field: description, type.

templates:
  # ht.template(name): empty DataFrame with these columns, in this order.
  # spt, atterberg, grain_size and permeability are their dataset's columns
  # without those only hangtu produces (SPEC §2.6; tests/test_registry.py).
  profile:        [loca_id, depth, elevation, ground_level, geology_unit, source]   # plus the user's value column
  permeability:   [loca_id, ground_level, depth, depth_top, depth_base, depth_basis, elevation, hydraulic_conductivity, qualifier, source, test_type, geology_unit, soil_class, geology_description]
  # One row per shear box stage, p.shear_box()'s columns without source_line (M17 a).
  shear_box:      [loca_id, specimen_id, sample_reference, specimen_reference, ground_level, depth, depth_basis, elevation, test_type, test_stage, sample_condition, encapsulation, failure_criterion, applied_normal_stress, normal_stress_at_peak, normal_stress_at_residual, peak_shear_stress, residual_shear_stress, horizontal_displacement_at_peak, horizontal_displacement_at_residual, vertical_displacement_at_peak, vertical_displacement_at_residual, peak_displacement_rate, residual_displacement_rate, shear_traverses, specimen_height, specimen_diameter_along_shear, specimen_diameter_across_shear, water_content, final_water_content, bulk_unit_weight, dry_unit_weight, particle_density, particle_density_assumed, void_ratio, reported_peak_cohesion, reported_peak_friction_angle, reported_residual_cohesion, reported_residual_friction_angle, test_remarks, remarks, geology_unit, soil_class, geology_description]
  # The strength template is p.undrained_strength()'s columns without those the
  # analysis adds (docs/data/datasets.md §11.1).
  strength:       [loca_id, specimen_id, sample_reference, specimen_reference, ground_level, depth, depth_basis, elevation, source, test_type, test_stage, multistage_test, sample_condition, undrained_shear_strength, qualifier, remolded_undrained_shear_strength, remolded_qualifier, reported_undrained_shear_strength, cell_pressure, deviator_stress_at_failure, unconfined_compressive_strength, hand_penetrometer_reading, axial_strain_at_failure, water_content, bulk_unit_weight, dry_unit_weight, test_remarks, remarks, geology_unit, soil_class, geology_description]
  index:          [loca_id, depth, ground_level, elevation, water_content, bulk_unit_weight, geology_unit]
  spt:            [loca_id, ground_level, depth, depth_basis, elevation, spt_n, spt_n60, energy_ratio, spt_refusal, spt_penetration, remarks, geology_unit, soil_class, geology_description]
  atterberg:      [loca_id, specimen_id, sample_reference, specimen_reference, ground_level, depth, depth_basis, elevation, depth_top, depth_base, liquid_limit, plastic_limit, plasticity_index, non_plastic, water_content, geology_unit, soil_class, geology_description]
  grain_size:     [loca_id, specimen_id, sample_reference, specimen_reference, ground_level, depth, depth_basis, elevation, particle_size, percent_passing, qualifier, geology_unit, soil_class, geology_description]
  density:        [loca_id, specimen_id, sample_reference, specimen_reference, ground_level, depth, depth_basis, elevation, bulk_unit_weight, dry_unit_weight, water_content, particle_density, particle_density_assumed, sample_condition, stabilizer_content, source, test_type, geology_unit, soil_class, geology_description]
  particle_density: [loca_id, specimen_id, sample_reference, specimen_reference, ground_level, depth, depth_basis, elevation, particle_density, particle_density_assumed, test_type, geology_unit, soil_class, geology_description]
  # One row per stage at failure; p.triaxial() adds the principal stresses and their basis (M11 a).
  # Rock specimens too, a UCS test as a row with cell_pressure 0 (M17 c).
  triaxial:       [loca_id, specimen_id, sample_reference, specimen_reference, ground_level, depth, depth_basis, elevation, test_type, test_stage, multistage_test, sample_condition, failure_criterion, failure_mode, water_content, bulk_unit_weight, dry_unit_weight, void_ratio, effective_consolidation_stress, effective_vertical_consolidation_stress, effective_radial_consolidation_stress, back_pressure, pore_pressure_parameter_b, cell_pressure, deviator_stress_at_failure, pore_pressure_at_failure, axial_strain_at_failure, volumetric_strain_at_failure, reported_effective_friction_angle, reported_effective_cohesion, reported_axial_strain_at_50_percent_peak, reported_secant_modulus_at_50_percent_peak, reported_intact_compressive_strength, reported_intact_hoek_brown_constant, test_remarks, remarks, geology_unit, soil_class, geology_description]
  # One row per oedometer increment, p.oedometer()'s columns without source_line and
  # load_branch, which ht.analysis.oedometer_load_branch() adds (M19 a).
  oedometer:      [loca_id, specimen_id, sample_reference, specimen_reference, ground_level, depth, depth_basis, elevation, test_type, sample_condition, test_stage, applied_vertical_stress, void_ratio_at_increment_start, void_ratio_at_increment_end, reported_coefficient_of_volume_compressibility, reported_coefficient_of_consolidation_root_time, reported_coefficient_of_consolidation_log_time, specimen_height, specimen_diameter, water_content, final_water_content, bulk_unit_weight, dry_unit_weight, particle_density, particle_density_assumed, degree_of_saturation, void_ratio, swelling_pressure, height_change_on_saturation, equipment_deformation_corrected, test_remarks, remarks, geology_unit, soil_class, geology_description]
  # One row per reading during shearing (M11 c, P12 §3); stage values repeat on each row.
  # p.triaxial_readings()'s columns without source_line (M16, datasets.md §6.16).
  triaxial_readings: [loca_id, specimen_id, sample_reference, specimen_reference, ground_level, depth, depth_basis, elevation, test_type, test_stage, failure_criterion, effective_consolidation_stress, back_pressure, cell_pressure, axial_strain, deviator_stress, excess_pore_pressure, volumetric_strain, reported_failure_reading, geology_unit, soil_class, geology_description]
  # One row per shear box reading, p.shear_box_readings()'s columns without source_line (M16, datasets.md §6.17).
  shear_box_readings: [loca_id, specimen_id, sample_reference, specimen_reference, ground_level, depth, depth_basis, elevation, test_type, test_stage, applied_normal_stress, horizontal_displacement, shear_stress, vertical_displacement, geology_unit, soil_class, geology_description]
  # One row per settlement-time reading of an oedometer increment, its increment's
  # values on each row: p.oedometer_readings()'s columns without source_line (M19 c2,
  # datasets.md §6.18).
  oedometer_readings: [loca_id, specimen_id, sample_reference, specimen_reference, ground_level, depth, depth_basis, elevation, test_type, test_stage, load_branch, applied_vertical_stress, void_ratio_at_increment_start, void_ratio_at_increment_end, specimen_height, void_ratio, reported_coefficient_of_consolidation_root_time, reported_coefficient_of_consolidation_log_time, elapsed_time, vertical_displacement, geology_unit, soil_class, geology_description]
  # One row per override of a c_v construction's time range, passed as
  # consolidation_coefficient_from_readings(overrides=) (M19 c2, compressibility.md §9).
  consolidation_overrides: [specimen_id, test_stage, consolidation_method, curve_portion, elapsed_time_start, elapsed_time_end, override_reason]
  # A log per hole (ht.analysis.vertical_stress); p.stratigraphy() adds source_line.
  stratigraphy:   [loca_id, depth_top, depth_base, geology_unit, soil_class, geology_description]
  # Overlays (P01 §8): fill in one depth or elevation pair and leave the other blank.
  strata:         [geology_unit, depth_top, depth_base, elevation_top, elevation_base]
  ranges:         [low, high, label, source, depth_top, depth_base, elevation_top, elevation_base]
  design_lines:   [label, depth, elevation, value]
  # Baseline ranges per geology unit (P07 §8): one row per unit and property.
  baseline:       [geology_unit, property, low, central, high, source]
  # Plasticity chart regions (P04 §8): one row per vertex, in order around each polygon.
  plasticity_regions: [label, liquid_limit, plasticity_index]
  # Clogging diagram zones (P17 §8): one row per vertex, zones from the lowest potential to the highest.
  clogging_zones: [label, plasticity_index, consistency_index]
  # Grain size envelopes (P05 §8): one row per size, with rows sharing a label making one band.
  envelopes:      [label, particle_size, low, high]

fields:
  low:
    description: Lower bound of a published range, in the plotted value's units
    type: number
  high:
    description: Upper bound of a published range, in the plotted value's units
    type: number
  label:
    description: Text drawn beside an overlay
    type: text
  value:
    description: Value of a design line at a depth or elevation, in the plotted value's units
    type: number
  property:
    description: The value column a baseline row applies to, e.g. water_content
    type: text
  central:
    description: Central value of a baseline range (p50, mean or typical, as the report states)
    type: number

columns:

  # --- Location and depth -----------------------------------------------------
  loca_id:
    description: Exploratory hole ID
    type: text
    ags: [LOCA.LOCA_ID]
    used_by: [plot.profile, plot.spt_profile, plot.spt_histogram, plot.plasticity_chart, plot.grain_size, plot.water_content_profile, plot.geology_unit_comparison]
  location_type:
    description: Type of exploratory hole, as the code the file gives (CP, RC, ...)
    type: text
    ags: [LOCA.LOCA_TYPE]
    used_by: []
  easting:
    description: Easting of the hole, in the file's grid
    type: number
    quantity: length
    scale: interval
    label: Easting
    ags: [LOCA.LOCA_NATE]
    used_by: []
  northing:
    description: Northing of the hole, in the file's grid
    type: number
    quantity: length
    scale: interval
    label: Northing
    ags: [LOCA.LOCA_NATN]
    used_by: []
  latitude:
    description: Latitude of the hole, in decimal degrees
    type: number
    quantity: angle
    scale: interval
    label: Latitude
    ags: [LOCA.LOCA_LAT]
    used_by: []
  longitude:
    description: Longitude of the hole, in decimal degrees
    type: number
    quantity: angle
    scale: interval
    label: Longitude
    ags: [LOCA.LOCA_LON]
    used_by: []
  final_depth:
    description: Final depth of the hole
    type: number
    quantity: length
    scale: ratio
    label: Final depth
    ags: [LOCA.LOCA_FDEP]
    used_by: []
  specimen_id:
    description: Specimen identifier, unique in the project (a project's specimen key)
    type: text
    ags: ["derived: SAMP_TOP, SAMP_REF, SAMP_TYPE, SAMP_ID, SPEC_REF, SPEC_DPTH"]
    used_by: [plot.plasticity_chart, plot.grain_size, plot.water_content_profile]
  water_content_specimen_id:
    description: The specimen (specimen_id) whose water content a sample's row uses, chosen by depth
    type: text
    ags: ["derived: datasets.md §6.6"]
    used_by: []
  atterberg_specimen_id:
    description: The specimen (specimen_id) whose Atterberg limits a sample's row uses, chosen by depth
    type: text
    ags: ["derived: datasets.md §6.6"]
    used_by: []
  grain_size_specimen_id:
    description: The specimen (specimen_id) whose grading a sample's row uses, chosen by depth
    type: text
    ags: ["derived: datasets.md §6.6"]
    used_by: []
  sample_reference:
    description: The sample a result comes from, as the file names it (SAMP_ID, else type and reference at its top)
    type: text
    ags: [SAMP.SAMP_ID, "derived: SAMP_TYPE, SAMP_REF, SAMP_TOP"]
    used_by: []
  specimen_reference:
    description: Specimen reference within its sample
    type: text
    ags: [SPEC_REF]
    used_by: []
  depth:
    description: Depth of the observation below ground level (the plotted point for interval tests)
    type: number
    quantity: length
    scale: ratio
    label: Depth
    ags: ["derived: SPEC §8.2"]
    used_by: [plot.profile, plot.spt_profile, plot.spt_histogram, plot.plasticity_chart, plot.grain_size, plot.water_content_profile, plot.geology_unit_comparison]
  depth_top:
    description: "Top of an interval: a tested zone or a geology layer"
    type: number
    quantity: length
    scale: ratio
    label: Depth to top
    ags: [FGHG.FGHG_TOP, IPRG.IPRG_TOP, SPEC_DPTH, GEOL.GEOL_TOP]
    used_by: [plot.profile]
  depth_base:
    description: "Base of an interval: a tested zone or a geology layer"
    type: number
    quantity: length
    scale: ratio
    label: Depth to base
    ags: [FGHG.FGHG_BASE, IPRG.IPRG_BASE, SPEC_BASE, GEOL.GEOL_BASE]
    used_by: [plot.profile]
  depth_basis:
    description: How depth was chosen (mid_drive, sample_mid, zone_mid, test_depth, ...)
    type: text
    ags: ["derived: SPEC §8.2"]
    used_by: []
  ground_level:
    description: Ground level at the hole
    type: number
    quantity: length
    scale: interval
    label: Ground level
    ags: [LOCA.LOCA_GL]
    used_by: [plot.profile, plot.spt_profile, plot.water_content_profile]
  elevation:
    description: Elevation of the observation (ground_level - depth)
    type: number
    quantity: length
    scale: interval
    label: Elevation
    ags: ["derived: LOCA_GL - depth"]
    used_by: [plot.profile, plot.spt_profile, plot.water_content_profile]
  elevation_top:
    description: Elevation of the top of an interval, e.g. a stratum in an idealized profile
    type: number
    quantity: length
    scale: interval
    label: Elevation of top
    ags: ["derived: LOCA_GL - top depth"]
    used_by: [plot.profile]
  elevation_base:
    description: Elevation of the base of an interval
    type: number
    quantity: length
    scale: interval
    label: Elevation of base
    ags: ["derived: LOCA_GL - base depth"]
    used_by: [plot.profile]

  # --- Grouping and flags -------------------------------------------------------
  geology_unit:
    description: Geology unit (colors every plot)
    type: text
    ags: ["derived: GEOL key or mapping file, SPEC §8.3"]
    used_by: [plot.profile, plot.spt_profile, plot.spt_histogram, plot.plasticity_chart, plot.grain_size, plot.water_content_profile, plot.geology_unit_comparison]
  geology_description:
    description: Description of the geology layer the result is in
    type: text
    ags: [GEOL.GEOL_DESC]
    used_by: []
  geology_code:
    description: Geology code as written in GEOL_GEOL, unmapped
    type: text
    ags: [GEOL.GEOL_GEOL]
    used_by: []
  geology_code_secondary:
    description: Second geology code as written in GEOL_GEO2, unmapped
    type: text
    ags: [GEOL.GEOL_GEO2]
    used_by: []
  legend_code:
    description: Legend code as written in GEOL_LEG, unmapped
    type: text
    ags: [GEOL.GEOL_LEG]
    used_by: []
  geology_formation:
    description: Formation as written in GEOL_FORM, unmapped
    type: text
    ags: [GEOL.GEOL_FORM]
    used_by: []
  bgs_lexicon_code:
    description: BGS Lexicon code as written in GEOL_BGS, unmapped
    type: text
    ags: [GEOL.GEOL_BGS]
    used_by: []
  soil_class:
    description: "The geology unit's class, from the geology map: coarse or fine (read by the Mohr-Coulomb set's dilatancy rule), fill, rock or organic (named, read by nothing yet); other values are kept"
    type: text
    ags: ["derived: mapping file"]
    used_by: [plot.spt_histogram]
  source:
    description: Where the value came from, e.g. lab or field
    type: text
    ags: ["derived: group of origin"]
    used_by: [plot.profile, plot.geology_unit_comparison]
    statistics: {role: source}
  test_type:
    description: Test method, e.g. falling head, packer, UU, torvane
    type: text
    ags: [PTST.PTST_TYPE, FGHG.FGHG_TYPE, IPRG.IPRG_TYPE, LPDN.LPDN_TYPE, LDEN.LDEN_TYPE, IDEN.IDEN_TYPE, TREG.TREG_TYPE, TRIG.TRIG_TYPE, IVAN.IVAN_TYPE, LVAN.LVAN_TYPE, SHBG.SHBG_TYPE, CONG.CONG_TYPE]
    used_by: [plot.profile]
    statistics: {role: source}
  remarks:
    description: Remarks the file gives for the record
    type: text
    ags: [LOCA.LOCA_REM, ISPT.ISPT_REM, TRET.TRET_REM, TRIT.TRIT_REM, LUCT.LUCT_REM, LVAN.LVAN_REM, LPEN.LPEN_REM, LFCN.LFCN_REM, IVAN.IVAN_REM, IPEN.IPEN_REM, SHBT.SHBT_REM, CONS.CONS_REM]
    used_by: []
  source_line:
    description: Line of the record in the AGS file, to check a value against the file
    type: number
    quantity: count
    scale: ratio
    label: Source line
    ags: ["derived: the record's line in the file"]
    used_by: []
  qualifier:
    description: '"<" or ">" when the true value is below or above the reported value; empty otherwise'
    type: text
    ags: ["derived: value flags LT / GT"]
    used_by: [plot.profile, plot.geology_unit_comparison]
    statistics: {role: qualifier}

  # --- Properties (P01 presets; preset name = column name) ---------------------------------------------------
  hydraulic_conductivity:
    description: Hydraulic conductivity
    type: number
    quantity: hydraulic_conductivity
    scale: ratio
    label: Hydraulic conductivity, k
    ags: [PTST.PTST_K, FGHG.FGHG_IPRM, IPRG.IPRG_IPRM]
    used_by: [plot.profile, plot.geology_unit_comparison]
  undrained_shear_strength:
    description: Undrained shear strength
    type: number
    quantity: stress
    scale: ratio
    label: Undrained shear strength, s_u
    ags: ["derived: q_f / 2 or q_u / 2, docs/analysis/strength.md §7", IVAN.IVAN_IVAN, LVAN.LVAN_VNPK, LPEN.LPEN_PPEN, LFCN.LFCN_FCPK]
    used_by: [plot.profile, plot.geology_unit_comparison]
  undrained_shear_strength_basis:
    description: How s_u was found (half_deviator_stress, half_unconfined_compressive_strength, half_hand_penetrometer_reading, hand_penetrometer_reading, as_reported)
    type: text
    ags: ["derived: ht.analysis.undrained_shear_strength_from_tests()"]
    used_by: []
  reported_undrained_shear_strength:
    description: The lab's own s_u for a test hangtu computes s_u from (TRIT_CU beside q_f / 2)
    type: number
    quantity: stress
    scale: ratio
    label: Reported undrained shear strength, s_u
    ags: [TRIT.TRIT_CU]
    used_by: []
  unconfined_compressive_strength:
    description: Unconfined compressive strength of a soil specimen, q_u (not rock's uniaxial compressive strength)
    type: number
    quantity: stress
    scale: ratio
    label: Unconfined compressive strength, q_u
    ags: [LUCT.LUCT_UCS]
    used_by: []
  hand_penetrometer_reading:
    description: A hand penetrometer's reading as written, s_u or q_u by the instrument (IPEN_IPEN)
    type: number
    quantity: stress
    scale: ratio
    label: Hand penetrometer reading
    ags: [IPEN.IPEN_IPEN]
    used_by: []
  strength_sensitivity:
    description: Sensitivity, the peak over the remolded undrained shear strength of one test
    type: number
    quantity: dimensionless
    scale: ratio
    label: Sensitivity, S_t = s_u / s_u,r
    ags: ["derived: ht.analysis.undrained_shear_strength_from_tests()"]
    used_by: []
  remolded_undrained_shear_strength:
    description: Undrained shear strength of the soil remolded, from the same test as the peak (vane, fall cone)
    type: number
    quantity: stress
    scale: ratio
    label: Remolded undrained shear strength, s_u,r
    ags: [IVAN.IVAN_IVAR, LVAN.LVAN_VNRM, LFCN.LFCN_FCRM]
    used_by: [plot.profile, plot.geology_unit_comparison]
  remolded_qualifier:
    description: '"<" or ">" when the true remolded strength is below or above the reported value; empty otherwise'
    type: text
    ags: ["derived: value flags LT / GT"]
    used_by: []
    statistics: {role: qualifier, values: [remolded_undrained_shear_strength], replaces: qualifier}
  water_content:
    description: Water (moisture) content
    type: number
    quantity: percent
    scale: ratio
    label: Water content, w
    ags: [LNMC.LNMC_MC, LDEN.LDEN_MC, IDEN.IDEN_MC, TRET.TRET_IMC, TRIT.TRIT_IMC, LUCT.LUCT_IWC, LVAN.LVAN_MC, LPEN.LPEN_MC, LFCN.LFCN_WC, SHBT.SHBT_MCI, CONG.CONG_MCI]
    used_by: [plot.profile, plot.water_content_profile, plot.geology_unit_comparison]
  bulk_unit_weight:
    description: Bulk unit weight
    type: number
    quantity: unit_weight
    scale: ratio
    label: Bulk unit weight, γ
    ags: ["derived: LDEN.LDEN_BDEN × g", "derived: IDEN.IDEN_IDEN × g", "derived: TRET.TRET_BDEN × g", "derived: TRIT.TRIT_BDEN × g", "derived: LUCT.LUCT_BDEN × g", "derived: SHBT.SHBT_BDEN × g", "derived: CONG.CONG_BDEN × g"]
    used_by: [plot.profile, plot.geology_unit_comparison]
  saturated_unit_weight:
    description: Saturated unit weight, used below the water level
    type: number
    quantity: unit_weight
    scale: ratio
    label: Saturated unit weight, γ_sat
    ags: ["derived: the judgments file (SPEC §4)", "derived: ht.analysis.phase_relations()"]
    used_by: []
  dry_unit_weight:
    description: Dry unit weight, the weight of the solids per unit total volume
    type: number
    quantity: unit_weight
    scale: ratio
    label: Dry unit weight, γ_d
    ags: ["derived: LDEN.LDEN_DDEN × g", "derived: TRET.TRET_DDEN × g", "derived: TRIT.TRIT_DDEN × g", "derived: ht.analysis.phase_relations()", "derived: LUCT.LUCT_DDEN × g", "derived: SHBT.SHBT_DDEN × g", "derived: CONG.CONG_DDEN × g"]
    used_by: []
  sample_condition:
    description: The specimen's condition as tested (UNDISTURBED, RECOMPACTED)
    type: text
    ags: [LDEN.LDEN_COND, TREG.TREG_COND, TRIG.TRIG_COND, LUCT.LUCT_TYPE, SHBG.SHBG_COND, CONG.CONG_COND]
    used_by: []
  stabilizer_content:
    description: Stabilizer added to the ground before a field density test
    type: number
    quantity: percent
    scale: ratio
    label: Stabilizer content
    ags: [IDEN.IDEN_STAB]
    used_by: []
  particle_density:
    description: Density of the solid particles, rho_s (Gs = rho_s / rho_w)
    type: number
    quantity: density
    scale: ratio
    label: Particle density, ρ_s
    ags: [LPDN.LPDN_PDEN, SHBT.SHBT_PDEN, CONG.CONG_PDEN]
    used_by: []
  particle_density_assumed:
    description: True if the file marked the particle density as assumed (#)
    type: bool
    ags: ["derived: value flag ASSUMED"]
    used_by: []
    statistics: {role: assumed, values: [particle_density]}
  particle_density_specimen_id:
    description: The LPDN specimen (its specimen_id) whose particle density p.density() joined
    type: text
    ags: ["derived: docs/data/datasets.md §6.8"]
    used_by: []
  # Phase relations (ht.analysis.phase_relations, M14 b).
  specific_gravity:
    description: Specific gravity of the solids, Gs = rho_s / rho_w
    type: number
    quantity: dimensionless
    scale: ratio
    label: Specific gravity, G_s
    ags: ["derived: ht.analysis.phase_relations()", "derived: the judgments file (SPEC §4)"]
    used_by: []
  specific_gravity_source:
    description: Where the row's Gs came from (measured, assumed, judgment)
    type: text
    ags: ["derived: ht.analysis.phase_relations()"]
    used_by: []
    statistics:
      role: assumed
      when: [assumed, judgment]
      values: [specific_gravity, void_ratio, porosity, degree_of_saturation, saturated_unit_weight]
  void_ratio:
    description: Void ratio, volume of voids / volume of solids (a specimen's initial, or from gamma, w and Gs)
    type: number
    quantity: dimensionless
    scale: ratio
    label: Void ratio, e
    ags: [TRET.TRET_IVR, "derived: ht.analysis.phase_relations()", SHBT.SHBT_IVR, CONG.CONG_IVR]
    used_by: [plot.profile, plot.geology_unit_comparison]
  porosity:
    description: Porosity, volume of voids / total volume
    type: number
    quantity: percent
    scale: ratio
    label: Porosity, n
    ags: ["derived: ht.analysis.phase_relations()"]
    used_by: [plot.profile, plot.geology_unit_comparison]
  degree_of_saturation:
    description: Degree of saturation, volume of water / volume of voids
    type: number
    quantity: percent
    scale: ratio
    label: Degree of saturation, S
    ags: ["derived: ht.analysis.phase_relations()", CONG.CONG_SATR]
    used_by: [plot.profile, plot.geology_unit_comparison]
  oversaturated:
    description: True if the degree of saturation is above 100 % by more than the tolerance
    type: bool
    ags: ["derived: ht.analysis.phase_relations()"]
    used_by: []

  # --- Vertical stress (ht.analysis.vertical_stress, M13) --------------------------------
  total_vertical_stress:
    description: Total vertical stress from the unit weights through the log
    type: number
    quantity: stress
    scale: ratio
    label: Total vertical stress, σ_v0
    ags: ["derived: ht.analysis.vertical_stress()"]
    used_by: [plot.profile]
  pore_pressure:
    description: In situ pore pressure (hydrostatic from the water level)
    type: number
    quantity: stress
    scale: ratio
    label: Pore pressure, u_0
    ags: ["derived: ht.analysis.vertical_stress()"]
    used_by: [plot.profile]
  effective_vertical_stress:
    description: Effective vertical stress, total less pore pressure
    type: number
    quantity: stress
    scale: ratio
    label: Effective vertical stress, σ′_v0
    ags: ["derived: ht.analysis.vertical_stress()"]
    used_by: [plot.profile]

  # --- Strength (correlations from M13; measured values from W2) -----------------------
  effective_friction_angle:
    description: Effective (drained) friction angle, peak unless the source says otherwise
    type: number
    quantity: angle
    scale: ratio
    label: Effective friction angle, φ′
    ags: ["derived: docs/analysis/correlations.md", "derived: arcsin(slope) of mohr_coulomb_fit()'s s′–t line"]
    used_by: [plot.profile]
  effective_cohesion:
    description: Effective cohesion intercept of a Mohr-Coulomb envelope fitted to failure points
    type: number
    quantity: stress
    scale: ratio
    label: Effective cohesion, c′
    ags: ["derived: intercept / cos φ′ of mohr_coulomb_fit()'s s′–t line"]
    used_by: []
  dilatancy_angle:
    description: Dilatancy angle of a Mohr-Coulomb set, by Bolton's relation, 0 for a fine-grained unit, or selected
    type: number
    quantity: angle
    scale: ratio
    label: Dilatancy angle, ψ
    ags: ["derived: docs/analysis/statistics.md §7"]
    used_by: []
  total_stress_cohesion:
    description: Cohesion intercept of a Mohr-Coulomb envelope fitted to total-stress failure points
    type: number
    quantity: stress
    scale: ratio
    label: Total stress cohesion, c
    ags: ["derived: intercept / cos φ of mohr_coulomb_fit()'s s–t line"]
    used_by: []
  total_stress_friction_angle:
    description: Friction angle of a Mohr-Coulomb envelope fitted to total-stress failure points
    type: number
    quantity: angle
    scale: ratio
    label: Total stress friction angle, φ
    ags: ["derived: arcsin(slope) of mohr_coulomb_fit()'s s–t line"]
    used_by: []
  intact_compressive_strength:
    description: Intact compressive strength σci of a Hoek–Brown criterion fitted to rock triaxial and UCS failures
    type: number
    quantity: stress
    scale: ratio
    label: Intact compressive strength, σci
    ags: ["derived: √intercept of hoek_brown_fit()'s (σ1 − σ3)²–σ3 line"]
    used_by: [plot.hoek_brown_envelope]
  intact_hoek_brown_constant:
    description: Hoek–Brown constant mi of intact rock, fitted with σci to rock triaxial and UCS failures
    type: number
    quantity: dimensionless
    scale: ratio
    label: Hoek–Brown constant of intact rock, mi
    ags: ["derived: slope / σci of hoek_brown_fit()'s (σ1 − σ3)²–σ3 line"]
    used_by: [plot.hoek_brown_envelope]
  peak_cohesion:
    description: Cohesion intercept of a line fitted to shear box peak stages, τ against σn
    type: number
    quantity: stress
    scale: ratio
    label: Peak cohesion, c_p
    ags: ["derived: intercept of shear_box_fit()'s peak τ–σn line"]
    used_by: [plot.shear_box_envelope]
  peak_friction_angle:
    description: Friction angle of a line fitted to shear box peak stages, τ against σn
    type: number
    quantity: angle
    scale: ratio
    label: Peak friction angle, φ_p
    ags: ["derived: arctan(slope) of shear_box_fit()'s peak τ–σn line"]
    used_by: [plot.shear_box_envelope]
  residual_cohesion:
    description: Cohesion intercept of a line fitted to shear box residual stages, τ against σn
    type: number
    quantity: stress
    scale: ratio
    label: Residual cohesion, c_r
    ags: ["derived: intercept of shear_box_fit()'s residual τ–σn line"]
    used_by: [plot.shear_box_envelope]
  residual_friction_angle:
    description: Friction angle of a line fitted to shear box residual stages, τ against σn
    type: number
    quantity: angle
    scale: ratio
    label: Residual friction angle, φ_r
    ags: ["derived: arctan(slope) of shear_box_fit()'s residual τ–σn line"]
    used_by: [plot.shear_box_envelope]
  critical_state_friction_angle:
    description: Critical state (constant volume) friction angle φ′cv, a judgment keyed by geology unit
    type: number
    quantity: angle
    scale: ratio
    label: Critical state friction angle, φ′cv
    ags: ["derived: the judgments file (docs/analysis/judgments.md §5.8)"]
    used_by: []
  plane_strain_friction_angle:
    description: Plane strain compression friction angle φ′psc, from a shear box φ′ by Kulhawy & Mayne (1990) Eq. 4-10
    type: number
    quantity: angle
    scale: ratio
    label: Plane strain friction angle, φ′psc
    ags: ["derived: arctan(tan φ′ds / cos φ′cv), docs/analysis/strength.md §8"]
    used_by: []
  undrained_shear_strength_lower:
    description: Lower bound of an undrained shear strength given as a band, such as a correlation's
    type: number
    quantity: stress
    scale: ratio
    label: Undrained shear strength (lower), s_u
    ags: ["derived: docs/analysis/correlations.md"]
    used_by: [plot.profile]
  undrained_shear_strength_upper:
    description: Upper bound of an undrained shear strength given as a band; blank for an open band
    type: number
    quantity: stress
    scale: ratio
    label: Undrained shear strength (upper), s_u
    ags: ["derived: docs/analysis/correlations.md"]
    used_by: [plot.profile]

  # --- Stress history (correlations from M13; oedometer values from M19) ---------------
  preconsolidation_stress:
    description: Preconsolidation stress, the largest effective vertical stress the soil behaves as having carried
    type: number
    quantity: stress
    scale: ratio
    label: Preconsolidation stress, σ′p
    ags: ["derived: docs/analysis/correlations.md", "derived: docs/analysis/compressibility.md"]
    used_by: [plot.profile, plot.consolidation_curve]
  overconsolidation_ratio:
    description: Overconsolidation ratio, preconsolidation stress over effective vertical stress
    type: number
    quantity: dimensionless
    scale: ratio
    label: Overconsolidation ratio, OCR
    ags: ["derived: docs/analysis/correlations.md", "derived: docs/analysis/compressibility.md"]
    used_by: [plot.profile, plot.consolidation_curve]
  preconsolidation_stress_pacheco_silva:
    description: Preconsolidation stress by Pacheco Silva's construction on an oedometer curve, the check on the fitted one
    type: number
    quantity: stress
    scale: ratio
    label: Preconsolidation stress, σ′p by Pacheco Silva
    ags: ["derived: docs/analysis/compressibility.md"]
    used_by: [plot.consolidation_curve]
  compression_index:
    description: Compression index, the slope of the virgin loading line of e against log10 effective vertical stress (positive)
    type: number
    quantity: dimensionless
    scale: ratio
    label: Compression index, Cc
    ags: ["derived: docs/analysis/compressibility.md"]
    used_by: [plot.consolidation_curve]
  recompression_index:
    description: Recompression index, the slope of e against log10 effective vertical stress on first loading below the preconsolidation stress (positive)
    type: number
    quantity: dimensionless
    scale: ratio
    label: Recompression index, Cr
    ags: ["derived: docs/analysis/compressibility.md"]
    used_by: [plot.consolidation_curve]
  swelling_index:
    description: Swelling index, the slope of e against log10 effective vertical stress on an unload (positive)
    type: number
    quantity: dimensionless
    scale: ratio
    label: Swelling index, Cs
    ags: ["derived: docs/analysis/compressibility.md"]
    used_by: [plot.consolidation_curve]
  compression_ratio:
    description: Compression ratio, the compression index over 1 + the initial void ratio
    type: number
    quantity: dimensionless
    scale: ratio
    label: Compression ratio, CR = Cc/(1 + e0)
    ags: ["derived: docs/analysis/compressibility.md"]
    used_by: [plot.consolidation_curve]
  normalized_void_ratio_change:
    description: Change in void ratio from the initial state to reloading at the in situ effective vertical stress, over the initial void ratio (sample quality)
    type: number
    quantity: dimensionless
    scale: ratio
    label: Normalized change in void ratio, Δe/e0
    ags: ["derived: docs/analysis/compressibility.md"]
    used_by: [plot.consolidation_curve]
  sample_quality:
    description: Sample quality class by the normalized change in void ratio (Lunne et al. 1997), e.g. very good to excellent
    type: text
    ags: ["derived: docs/analysis/compressibility.md"]
    used_by: [plot.consolidation_curve]
  at_rest_earth_pressure_coefficient:
    description: At-rest earth pressure coefficient, horizontal over vertical effective stress
    type: number
    quantity: dimensionless
    scale: ratio
    label: At-rest earth pressure coefficient, K0
    ags: ["derived: docs/analysis/correlations.md"]
    used_by: [plot.profile]
  drained_youngs_modulus:
    description: Drained Young's modulus, a secant modulus at working strains, not the small-strain E0
    type: number
    quantity: modulus
    scale: ratio
    label: Drained Young's modulus, E′
    ags: ["derived: docs/analysis/correlations.md"]
    used_by: [plot.profile]
  drained_poissons_ratio:
    description: Drained Poisson's ratio, of a Mohr-Coulomb set (selected; derived values aren't built yet)
    type: number
    quantity: dimensionless
    scale: ratio
    label: Drained Poisson's ratio, ν′
    ags: ["derived: docs/analysis/statistics.md §7"]
    used_by: []
  shear_wave_velocity:
    description: Shear wave velocity, measured in situ or estimated
    type: number
    quantity: velocity
    scale: ratio
    label: Shear wave velocity, V_s
    ags: [ISTA.ISTA_WVL]   # where ISTA_WVTY gives a shear wave; the dataset is W5's
    used_by: [plot.profile]

  # --- Correlations (ht.analysis.correlations, M13) ----------------------------------------
  correlation_name:
    description: The correlation an estimate came from, by its function's name
    type: text
    ags: ["derived: docs/analysis/correlations.md"]
    used_by: [plot.profile]
    statistics: {role: source}
  correlation_soil:
    description: The source's soil row a correlation's coefficient was taken from (soil=)
    type: text
    ags: ["derived: docs/analysis/correlations.md"]
    used_by: [plot.profile]
  conversion_name:
    description: The conversion a value came from, by its function's name, such as a shear box φ′ converted to triaxial
    type: text
    ags: ["derived: docs/analysis/strength.md §8"]
    used_by: []
    statistics: {role: source}
  conversion_soil:
    description: The soil type a conversion's ratio was taken from (soil=)
    type: text
    ags: ["derived: docs/analysis/strength.md §8"]
    used_by: []
  parameter_source:
    description: The source of a parameter's values in a comparison, such as a correlation, a test type or a fit
    type: text
    ags: ["derived: docs/analysis/statistics.md §5"]
    used_by: [plot.profile, plot.geology_unit_comparison]
    statistics: {role: source}
  source_kind:
    description: Whether a compared source gives values row by row ("rows") or fitted values ("fit")
    type: text
    ags: ["derived: docs/analysis/statistics.md §5"]
    used_by: []
  correlation_input:
    description: The correlation an input came from, when a correlation read another's estimate
    type: text
    ags: ["derived: docs/analysis/correlations.md"]
    used_by: [plot.profile]
  correlation_qualifier:
    description: "Whether a correlation's estimate is a bound: > at least (a refusal, or N above the range), < at most (N below the range), blank otherwise"
    type: text
    ags: ["derived: docs/analysis/correlations.md §3"]
    used_by: [plot.profile, plot.geology_unit_comparison]
    # Read alongside the generic qualifier, so a frame pooling lab and SPT
    # values counts each row's own (m18a spec decision 5).
    statistics:
      role: qualifier
      values:
        - effective_friction_angle
        - undrained_shear_strength
        - preconsolidation_stress
        - overconsolidation_ratio
        - at_rest_earth_pressure_coefficient
        - drained_youngs_modulus
        - shear_wave_velocity
  correlation_note:
    description: "Why a correlation gave no estimate (not for this soil, soil type unknown, input blank, refusal, below range or above range), or a bound (at least: refusal; at least or at most: N beyond the range)"
    type: text
    ags: ["derived: docs/analysis/correlations.md"]
    used_by: [plot.profile]
  correlation_data_count:
    description: The number of data points a correlation's source fit it to (its n); blank when not stated
    type: number
    quantity: count
    scale: ratio
    label: Correlation's data points, n
    ags: ["derived: docs/analysis/correlations.md §2"]
    used_by: []
  correlation_r_squared:
    description: The coefficient of determination a correlation's source gives (its r²); blank when not stated
    type: number
    quantity: dimensionless
    scale: ratio
    label: Correlation's coefficient of determination, r²
    ags: ["derived: docs/analysis/correlations.md §2"]
    used_by: []
  correlation_scatter:
    description: A correlation's scatter as its source states it, or "Not stated."
    type: text
    ags: ["derived: docs/analysis/correlations.md §2"]
    used_by: []
  correlation_advice:
    description: "The source's advice on using a correlation, quoted with its citation, or hangtu's own marked \"hangtu:\""
    type: text
    ags: ["derived: docs/analysis/correlations.md §2"]
    used_by: []

  # --- SPT (P02, P03) ------------------------------------------------------------------
  spt_n:
    description: SPT N as reported
    type: number
    quantity: count
    scale: ratio
    label: SPT N
    ags: [ISPT.ISPT_NVAL]
    used_by: [plot.spt_profile, plot.spt_histogram]
  spt_n_capped:
    description: min(N, spt_cap)
    type: number
    quantity: count
    scale: ratio
    label: SPT N (capped)
    ags: ["derived: docs/analysis/index-and-spt.md §1"]
    used_by: [plot.spt_profile, plot.spt_histogram]
  spt_n60:
    description: N corrected to 60% energy (N × ER / 60)
    type: number
    quantity: count
    scale: ratio
    label: SPT N60
    ags: ["derived: spt_n, energy_ratio"]
    used_by: [plot.spt_profile, plot.spt_histogram]
  spt_overburden_correction:
    description: "Overburden correction to σ′v = 100 kPa, C_N (ht.analysis.spt_n1_60, by method)"
    type: number
    quantity: dimensionless
    scale: ratio
    label: Overburden correction, C_N
    ags: ["derived: effective_vertical_stress"]
    used_by: [plot.profile]
  spt_n1_60:
    description: N60 corrected for overburden (N60 × C_N)
    type: number
    quantity: count
    scale: ratio
    label: SPT (N1)60
    ags: ["derived: spt_n60, spt_overburden_correction"]
    used_by: [plot.profile, plot.spt_profile]
  energy_ratio:
    description: Hammer energy ratio
    type: number
    quantity: percent
    scale: ratio
    label: Energy ratio, ER
    ags: [ISPT.ISPT_ERAT]
    used_by: [plot.spt_profile]
  energy_source:
    description: "Where N60 came from: file_n60, file_energy_ratio or hammer_efficiency"
    type: text
    ags: ["derived: docs/data/datasets.md §6.1"]
    used_by: []
  spt_penetration:
    description: Total penetration of the seating and test drives
    type: number
    quantity: small_length
    scale: ratio
    label: Penetration
    ags: [ISPT.ISPT_NPEN]
    used_by: [plot.spt_profile]
  spt_refusal:
    description: True if the test reached refusal or partial penetration
    type: bool
    ags: ["derived: docs/analysis/index-and-spt.md §1"]
    used_by: [plot.spt_profile, plot.spt_histogram]
    statistics: {role: at_least, values: [spt_n, spt_n60, spt_n_capped, spt_n1_60]}
  spt_class:
    description: SPT relative-density or consistency class, or Refusal
    type: text
    ags: ["derived: docs/analysis/index-and-spt.md §1.4"]
    used_by: [plot.spt_histogram]

  # --- Atterberg limits (P04, P06) ---------------------------------------------------------
  liquid_limit:
    description: Liquid limit
    type: number
    quantity: percent
    scale: ratio
    label: Liquid limit, LL
    ags: [LLPL.LLPL_LL]
    used_by: [plot.plasticity_chart, plot.water_content_profile]
  plastic_limit:
    description: Plastic limit
    type: number
    quantity: percent
    scale: ratio
    label: Plastic limit, PL
    ags: [LLPL.LLPL_PL]
    used_by: [plot.plasticity_chart, plot.water_content_profile]
  plasticity_index:
    description: Plasticity index (LL - PL)
    type: number
    quantity: dimensionless
    scale: ratio
    label: Plasticity index, PI
    ags: [LLPL.LLPL_PI]
    used_by: [plot.plasticity_chart, plot.geology_unit_comparison, plot.clogging_diagram]
  non_plastic:
    description: True if the specimen was reported non-plastic (NP)
    type: bool
    ags: ["derived: value flag NP"]
    used_by: [plot.plasticity_chart, plot.water_content_profile, plot.geology_unit_comparison]
    statistics:
      role: non_plastic
      values: [liquid_limit, plastic_limit, plasticity_index, liquidity_index, consistency_index, clay_activity]
  liquidity_index:
    description: (w - PL) / PI
    type: number
    quantity: dimensionless
    scale: interval
    label: Liquidity index, LI
    ags: ["derived"]
    used_by: [plot.geology_unit_comparison]
  consistency_index:
    description: (LL - w) / PI
    type: number
    quantity: dimensionless
    scale: interval
    label: Consistency index, Ic
    ags: ["derived"]
    used_by: [plot.geology_unit_comparison, plot.clogging_diagram]
  clay_activity:
    description: Activity of the clay, PI / percentage finer than 0.002 mm (Skempton 1953)
    type: number
    quantity: dimensionless
    scale: ratio
    label: Activity, A
    ags: ["derived: ht.analysis.clay_activity()"]
    used_by: [plot.geology_unit_comparison]
  clogging_potential:
    description: Clay clogging potential for TBM drives, the zone of PI and Ic (low, medium, medium-high, high; Thewes & Burger 2004)
    type: text
    ags: ["derived: ht.analysis.clogging_potential()"]
    used_by: [plot.clogging_diagram]
  plasticity_class_uscs:
    description: USCS fine-grained class from LL and PI (CL, CL-ML, ML, CH, MH; never OL or OH)
    type: text
    ags: ["derived: docs/analysis/index-and-spt.md §2.5"]
    used_by: [plot.plasticity_chart]
  plasticity_class_bs5930:
    description: BS 5930 plasticity class (C or M, then L, I, H, V or E by LL)
    type: text
    ags: ["derived: docs/analysis/index-and-spt.md §2.5"]
    used_by: [plot.plasticity_chart]
  uscs_symbol:
    description: USCS group symbol (ASTM D2487), e.g. SP-SM or CL; never OL or OH
    type: text
    ags: ["derived: docs/analysis/index-and-spt.md §2.6"]
    used_by: [plot.plasticity_chart, plot.grain_size]
  aashto_group:
    description: AASHTO soil group (AASHTO M 145), A-1-a to A-7-6
    type: text
    ags: ["derived: docs/analysis/index-and-spt.md §2.7"]
    used_by: []
  aashto_group_index:
    description: AASHTO group index (AASHTO M 145), a whole number, 0 or more
    type: number
    quantity: count
    scale: ratio
    label: AASHTO group index
    ags: ["derived: docs/analysis/index-and-spt.md §2.7"]
    used_by: []

