# Unit alias table: the first lookup for every unit string (docs/plots/P00-framework.md §4.2).
# Unit string  ->  pint expression        (case-sensitive)
# Add entries at run time with ht.add_unit_alias(text, pint_expr).
"m": "meter"
"ft": "foot"
"mm": "millimeter"
"in": "inch"
"kPa": "kilopascal"
"kN/m2": "kilonewton / meter**2"
"MPa": "megapascal"
"psf": "lbf / foot**2"
"ksf": "kip / foot**2"
"psi": "lbf / inch**2"
"tsf": "short_ton_force / foot**2"       # imperial context -> short ton
"t/m2": "metric_ton_force / meter**2"    # metric context -> metric tonne
"kN/m3": "kilonewton / meter**3"
"pcf": "lbf / foot**3"                   # resolved per column quantity kind (P00 §4.3 #1)
"Mg/m3": "megagram / meter**3"
"m/s": "meter / second"
"cm/s": "centimeter / second"
"%": "percent"
"deg": "degree"                          # angle (friction angle, inclination), not temperature
"DegC": "degC"                           # temperature; AGS uses DegC, never bare "deg"
"DegF": "degF"                           # temperature; may appear in US files
