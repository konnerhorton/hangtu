# Recognized text in numeric AGS columns (docs/data/ingest.md §8, SPEC §6.2).
# Matched case-sensitively after trimming spaces. Anything else in a numeric
# column is blank with flag OTHER and finding T001.

# The value is blank, and the cell gets the flag.
blank:
  NP: NP          # non-plastic
  Dry: DRY        # no water found

# A number after the prefix is kept, and the cell gets the flag. For LT and GT
# the number is also stored as the flag's bound.
prefix:
  "<": LT
  ">": GT
  "#": ASSUMED    # e.g. GRAG_PDEN "#2.65": particle density assumed

# SPT refusal (ingest.md §8). The report (ISPT_REP) is read in one of two forms,
# by one parser shared with QC S001 (ags/_values.py, spt_report):
# - complete: an optional blow list, then N=<n> ("5,6,6 N=12", "6,8/8,9,9,9 N=35").
#   Never a refusal.
# - incomplete: blows and blows/penetration pairs, ending in a pair, with no N=
#   ("25/75 50/75", "22-30-50/3\""). The flag goes on the N value, which is kept
#   as given or blank.
# The form decides, not the numbers: penetrations in the report are never used.
# In the N value itself, value_pattern ("50/75") keeps the blows (50).
refusal:
  group: ISPT
  value: ISPT_NVAL
  report: ISPT_REP
  value_pattern: '(\d+)\s*/\s*\d+'
  # A unit may follow a penetration, with or without a space.
  penetration_units: [mm, cm, in, '"']
  # Building blocks, substituted by name into the forms below; {unit} is any of
  # penetration_units.
  pair: '\d+\s*/\s*\d+(?:\.\d+)?(?:\s*{unit})?'
  separator: '(?:\s*[,-]\s*|\s+)'
  complete: '(?:(?:{pair}|\d+)(?:{separator}(?:{pair}|\d+))*\s+)?N\s*=\s*\d+'
  incomplete: '(?:(?:{pair}|\d+){separator})*{pair}'
