# Published correlations (ht.analysis.correlations; docs/work/m13b1-spt-framework.md,
# Decision 6). One entry per correlation, named as its function. The code reads
# target, inputs and range; each function's docstring repeats the sources, their
# locators and the range bounds, and tests/analysis/test_correlations.py checks
# that they agree. Every entry is recorded in df.attrs["correlations"] on each
# result, so results from one input concatenate with their attrs kept.
#
# Per entry:
#   target      the registry column estimated, and the unit the equation gives it in
#   equation    as text, for records and footnotes; the docstring has it in MathJax
#   inputs      {registry column: {variant, unit}}: the one variant the correlation
#               was derived with, and the unit its constants assume (null: none)
#   terms       optional {name: {equation, unit}}: a quantity the function computes
#               from its inputs, such as N pa / σ′v0, whose range the source gives
#   range       {input or term: {at_least | greater_than, at_most | less_than}}, in
#               the inputs' units; outside it the estimate is NaN, never extrapolated
#   labels      {input or term in range: how the docstring writes it}, for the
#               warning, so it names the range in the user's terms (TODO #41)
#   bands       optional, for a correlation published as classes: each class's lower
#               bound on the input (inclusive) and its target band (lower, upper;
#               upper null for an open band), written as <target>_lower / _upper
#   rows        optional, for a coefficient the source gives by soil type: {name:
#               {wording, coefficient, uscs}}, the source's wording, its coefficient,
#               and hangtu's proposed USCS groups for it; soil= names the row and
#               uscs= checks it (docs/work/m13b3-spt-stiffness.md, Decision 3)
#   applies_to, not_for, notes   as the sources state them
#   scatter     the source's own statistics (docs/work/m15b-correlation-statistics.md):
#               words (its statement, verbatim; "Not stated." when none), data_count
#               (its n), r_squared, standard_deviation {value, unit, scale}; null when
#               not stated. unit: a unit, pa (the entry's pa = 100 kPa), or null for a
#               dimensionless target. scale: arithmetic (the regression's standard
#               error in the target's terms), log10 or ln (a factor), or null while
#               not verified; only arithmetic goes on the rows
#   advice      {words, by}: the source's advice on use, at most a sentence, quoted
#               with by = its citation and locator, or hangtu's own with by = hangtu;
#               null when none
#   evaluations other databases' checks of the correlation, [] when none: bias (mean
#               of measured over estimated), coefficient_of_variation, data_count,
#               database, cite, locator. Kept off the rows; applying them is M18's
#   uscs        hangtu's proposed USCS groups for applies_to, used only with
#               uscs="proposed" (Decision 10); uscs_basis says how they were read
#   label       optional: the legend text, e.g. "Stroud (1974)"; by default the first
#               source's cite. Labels are unique within one target column
#   sources     the original first, then any later form used: cite (author and year,
#               as the docstring writes it), reference, and locators (equation,
#               table, page), each of which the docstring names

effective_friction_angle_hatanaka_uchida_1996:
  target: {column: effective_friction_angle, unit: deg}
  equation: "φ′ = (15.4 (N1)60)^0.5 + 20°"
  inputs:
    spt_n1_60: {variant: "(N1)60, N60 corrected for overburden", unit: null}
  range:
    spt_n1_60: {at_least: 4.55, at_most: 39.0}
  labels: {spt_n1_60: "(N1)60"}
  applies_to: relatively clean fine to medium sands
  not_for: micaceous sands; gravelly soils
  uscs: [SP, SW, SP-SM, SW-SM]
  uscs_basis: >-
    hangtu's reading of "relatively clean" sands: the clean and the
    clean-with-silt USCS sands; gravels and clayey or silty sands are left out
  scatter:
    words: "±3° for most of the data"
    data_count: null
    r_squared: null
    standard_deviation: null
  advice: null
  evaluations: []
  notes: >-
    The source's φ′ = (20 N1)^0.5 + 20 is for N1 at the 78 % energy of the
    Japanese tombi trip hammer, for 3.5 ≤ N1 ≤ 30, from drained triaxial tests
    on in situ frozen samples of sands from six sites. At 60 % energy the
    constant is 15.4 and the range 4.55 ≤ (N1)60 ≤ 39.0.
  sources:
    - cite: Hatanaka & Uchida (1996)
      reference: Soils and Foundations 36(4), 1-9
      locators: ["Eq. 6, p. 3", "Eq. 8, p. 7", "Conclusions, p. 8"]
    - cite: Loehr et al. (2016)
      reference: FHWA GEC 5, FHWA-NHI-16-072
      locators: ["Eq. 7.23, p. 7-55"]

effective_friction_angle_kulhawy_mayne_1990:
  target: {column: effective_friction_angle, unit: deg}
  equation: "φ′ = arctan{[N60 / (12.2 + 20.3 σ′v / pa)]^0.34}, pa = 100 kPa"
  inputs:
    spt_n60: {variant: "N60, N at 60 % energy, not corrected for overburden", unit: null}
    effective_vertical_stress: {variant: "σ′v at the test", unit: kPa}
  range:
    spt_n60: {at_most: 60}
    effective_vertical_stress: {greater_than: 0, at_most: 300}
  labels: {spt_n60: "N60", effective_vertical_stress: "σ′v"}
  applies_to: relatively clean sands
  not_for: null
  uscs: [SP, SW, SP-SM, SW-SM]
  uscs_basis: >-
    hangtu's reading of "relatively clean" sands: the clean and the
    clean-with-silt USCS sands; gravels and clayey or silty sands are left out
  scatter:
    words: "Not stated."
    data_count: null
    r_squared: null
    standard_deviation: null
  advice: {words: "somewhat conservative, especially for depths less than 6 ft", by: "Loehr et al. (2016), pp. 7-54 to 7-55"}
  evaluations: []
  notes: >-
    An approximation of Schmertmann's (1975) chart, drawn for σ′v up to 300 kPa
    and N60 up to 60. GEC 5 calls it "somewhat conservative, especially for
    depths less than 6 ft" (1.8 m). GEC 5 gives the input as N60.
  sources:
    - cite: Kulhawy & Mayne (1990)
      reference: EPRI EL-6800, Manual on Estimating Soil Properties for Foundation Design
      locators: ["Eq. 4-11"]
    - cite: Loehr et al. (2016)
      reference: FHWA GEC 5, FHWA-NHI-16-072
      locators: ["Eq. 7.22", "Fig. 7-41", "p. 7-54 to 7-55"]

undrained_shear_strength_terzaghi_peck_1967:
  target: {column: undrained_shear_strength, unit: kPa}
  equation: "s_u / pa by N class, pa = 100 kPa"
  inputs:
    spt_n: {variant: "field N, as measured (blows/ft), not corrected for energy", unit: null}
  range:
    spt_n: {at_least: 0}
  labels: {spt_n: "N"}
  bands:
    # spt_n: the class's lower N; lower, upper: s_u / pa
    - {spt_n: 0, lower: 0, upper: 0.125}
    - {spt_n: 2, lower: 0.125, upper: 0.25}
    - {spt_n: 4, lower: 0.25, upper: 0.5}
    - {spt_n: 8, lower: 0.5, upper: 1.0}
    - {spt_n: 15, lower: 1.0, upper: 2.0}
    - {spt_n: 30, lower: 2.0, upper: null}
  applies_to: clays
  not_for: null
  uscs: [CL, CH]
  uscs_basis: >-
    hangtu's reading of "clays": the USCS lean and fat clays
  scatter:
    words: "Not stated."
    data_count: null
    r_squared: null
    standard_deviation: null
  advice: {words: "SPT N-values are generally a poor predictor of undrained shear strength", by: "Loehr et al. (2016), p. 7-38"}
  evaluations: []
  notes: >-
    "Developed primarily using unconfined compression tests" (EPRI p. 4-53). The N values "have
    not all been standardized to the same energy level", so the input is
    field N. The lowest class is "< 1/8" in the source; its lower bound of 0
    is hangtu's, since s_u can't be negative. EPRI's fit through the table,
    s_u/pa ≈ 0.06 N (Eq. 4-59), isn't built, so the table isn't counted twice.
  sources:
    - cite: Terzaghi & Peck (1967)
      reference: Soil Mechanics in Engineering Practice, 2nd ed., Wiley
      locators: ["p. 347"]
    - cite: Kulhawy & Mayne (1990)
      reference: EPRI EL-6800, Manual on Estimating Soil Properties for Foundation Design
      locators: ["Table 4-10, p. 4-54", "p. 4-53"]

undrained_shear_strength_stroud_1974:
  target: {column: undrained_shear_strength, unit: kPa}
  equation: "s_u = f1 N60 pa / 100, f1 = 4.5 for PI ≥ 30; 4.5 to 5.5 for 15 ≤ PI < 30; pa = 100 kPa"
  inputs:
    spt_n60: {variant: "N60, N at 60 % energy, not corrected for overburden", unit: null}
    plasticity_index: {variant: "PI of the clay at the test, a judgment by geology unit", unit: null}
  range:
    plasticity_index: {at_least: 15}
  labels: {plasticity_index: "PI"}
  bands:
    # plasticity_index: the lower PI of each f1 range; lower, upper: f1
    - {plasticity_index: 15, lower: 4.5, upper: 5.5}
    - {plasticity_index: 30, lower: 4.5, upper: 4.5}
  applies_to: clays
  not_for: null
  uscs: [CL, CH]
  uscs_basis: >-
    hangtu's reading of "clays": the USCS lean and fat clays
  scatter:
    words: "Not stated."
    data_count: null
    r_squared: null
    standard_deviation: null
  advice: {words: "somewhat lower bound values", by: "Loehr et al. (2016), p. 7-38"}
  evaluations: []
  notes: >-
    GEC 5 gives f1 = 4.5 for PI ≳ 30 and 5.5 for PI ≅ 15, and nothing between.
    hangtu gives one value at PI ≥ 30 and, for 15 ≤ PI < 30, the band 4.5 to
    5.5 with no central value: nothing is interpolated. No N range is stated.
  sources:
    - cite: Stroud (1974)
      reference: European Symposium on Penetration Testing (ESOPT-II), Vol. 2, 367-375
      locators: ["pp. 367-375"]
    - cite: Loehr et al. (2016)
      reference: FHWA GEC 5, FHWA-NHI-16-072
      locators: ["Eq. 7.19, p. 7-38"]

preconsolidation_stress_mayne_kemper_1988:
  target: {column: preconsolidation_stress, unit: kPa}
  equation: "σ′p = 0.47 N pa, pa = 100 kPa"
  inputs:
    spt_n: {variant: "field N, as measured (blows/ft), not corrected for energy", unit: null}
  range:
    spt_n: {at_least: 0.5, at_most: 200}
  labels: {spt_n: "N"}
  applies_to: clays
  not_for: null
  uscs: [CL, CH]
  uscs_basis: >-
    hangtu's reading of "clays": the USCS lean and fat clays
  scatter:
    words: "n = 126, r² = 0.699, S.D. = 4.37 pa"
    data_count: 126
    r_squared: 0.699
    standard_deviation: {value: 4.37, unit: pa, scale: null}   # 🔬 arithmetic or log: docs/work/m15b-correlation-statistics.md
  advice: {words: "SPT N is a poor predictor in clay: use the estimate to check oedometer σ′p, not in its place.", by: hangtu}
  evaluations: []
  notes: >-
    A regression on 49 intact and 2 fissured clays; the fissured clays plot
    above the trend. The range is the chart's N axis, 0.5 to 200 blows/ft. A
    separate regression from OCR's (0.58), on different data, so σ′p and OCR
    are two correlations, not one derived from the other.
  sources:
    - cite: Mayne & Kemper (1988)
      reference: Geotechnical Testing Journal 11(2), 139-147
      locators: ["p. 144"]
    - cite: Kulhawy & Mayne (1990)
      reference: EPRI EL-6800, Manual on Estimating Soil Properties for Foundation Design
      locators: ["Fig. 3-9, p. 3-10"]

overconsolidation_ratio_mayne_kemper_1988:
  target: {column: overconsolidation_ratio, unit: null}
  equation: "OCR = 0.58 N pa / σ′v0, pa = 100 kPa"
  inputs:
    spt_n: {variant: "field N, as measured (blows/ft), not corrected for energy", unit: null}
    effective_vertical_stress: {variant: "σ′v0 at the test", unit: kPa}
  terms:
    normalized_n: {equation: "spt_n × pa / effective_vertical_stress", unit: null}
  range:
    effective_vertical_stress: {greater_than: 0}
    normalized_n: {at_least: 1, at_most: 100}
  labels: {effective_vertical_stress: "σ′v0", normalized_n: "N pa/σ′v0"}
  applies_to: clays
  not_for: null
  uscs: [CL, CH]
  uscs_basis: >-
    hangtu's reading of "clays": the USCS lean and fat clays
  scatter:
    words: "n = 112, r² = 0.661, S.D. = 3.82"
    data_count: 112
    r_squared: 0.661
    standard_deviation: {value: 3.82, unit: null, scale: null}   # 🔬 as above
  advice: {words: "SPT N is a poor predictor in clay: use the estimate to check oedometer OCR, not in its place.", by: hangtu}
  evaluations: []
  notes: >-
    A regression on 48 intact and 3 fissured clays. The range is the chart's
    axis, 1 ≤ N pa/σ′v0 ≤ 100 (OCR 1 to 50).
  sources:
    - cite: Mayne & Kemper (1988)
      reference: Geotechnical Testing Journal 11(2), 139-147
      locators: ["p. 143"]
    - cite: Kulhawy & Mayne (1990)
      reference: EPRI EL-6800, Manual on Estimating Soil Properties for Foundation Design
      locators: ["Fig. 3-18, p. 3-18"]

at_rest_earth_pressure_coefficient_kulhawy_et_al_1989:
  target: {column: at_rest_earth_pressure_coefficient, unit: null}
  equation: "K0 = 0.073 N pa / σ′v0, pa = 100 kPa"
  inputs:
    spt_n: {variant: "field N, as measured (blows/ft), not corrected for energy", unit: null}
    effective_vertical_stress: {variant: "σ′v0 at the test", unit: kPa}
  terms:
    normalized_n: {equation: "spt_n × pa / effective_vertical_stress", unit: null}
  range:
    effective_vertical_stress: {greater_than: 0}
    normalized_n: {greater_than: 0, at_most: 60}
  labels: {effective_vertical_stress: "σ′v0", normalized_n: "N pa/σ′v0"}
  applies_to: clays
  not_for: null
  uscs: [CL, CH]
  uscs_basis: >-
    hangtu's reading of "clays": the USCS lean and fat clays
  scatter:
    words: "n = 57, r² = 0.771, S.D. = 0.43"
    data_count: 57
    r_squared: 0.771
    standard_deviation: {value: 0.43, unit: null, scale: null}   # 🔬 as above
  advice: 
    words: >-
      Measured K0 averaged about twice the estimate on another clay
      database (see evaluations): use it to check measured K0, not in its place.
    by: hangtu
  evaluations: 
    # b: the mean of measured over estimated; its coefficient of variation
    - bias: 2.16
      coefficient_of_variation: 0.70
      data_count: 74
      database: "TC304 clay database, CLAY/12/3997"
      cite: Ching & Schweckendiek (2021)
      locator: "Table 5.2, p. 178"
  notes: >-
    A regression on 13 intact and 5 fissured clays. The range is the chart's
    axis, 0 < N pa/σ′v0 ≤ 60.
  sources:
    - cite: Kulhawy et al. (1989)
      reference: >-
        Kulhawy, Jackson & Mayne, Foundation Engineering: Current Principles
        and Practices, ASCE, 121-134
      locators: ["p. 129"]
    - cite: Kulhawy & Mayne (1990)
      reference: EPRI EL-6800, Manual on Estimating Soil Properties for Foundation Design
      locators: ["Eq. 3-31, p. 3-27", "Fig. 3-30, p. 3-28"]
    - cite: Ching & Schweckendiek (2021)
      reference: ISSMGE TC304 state-of-the-art review of inherent variability and transformation uncertainty
      locators: ["Table 5.2, p. 178", "§5.1, p. 176"]

drained_youngs_modulus_aashto_2004:
  target: {column: drained_youngs_modulus, unit: tsf}
  equation: "E = C (N1)60 tsf, C = 4, 7, 10 or 12 by soil row"
  inputs:
    spt_n1_60: {variant: "(N1)60, N60 corrected for overburden", unit: null}
  range:
    spt_n1_60: {greater_than: 0}
  labels: {spt_n1_60: "(N1)60"}
  rows:
    silts:
      wording: "Silts, sandy silts, slightly cohesive mixtures"
      coefficient: 4
      uscs: [ML, CL-ML]
    clean_fine_to_medium_sands:
      wording: "Clean fine to medium sands and slightly silty sands"
      coefficient: 7
      uscs: [SP, SW, SP-SM, SW-SM]
    coarse_sands:
      wording: "Coarse sands and sands with little gravel"
      coefficient: 10
      uscs: [SP, SW, SP-SM, SW-SM]
    gravels:
      wording: "Sandy gravel and gravels"
      coefficient: 12
      uscs: [GP, GW, GP-GM, GW-GM]
  applies_to: silts, sands and gravels, by the source's soil rows
  not_for: null
  uscs: null
  uscs_basis: >-
    Each row's groups are hangtu's reading of its wording. A USCS symbol
    doesn't say whether a sand is fine or coarse, so the two sand rows share
    their groups: the check catches a gravel or a clay, not the wrong sand.
  scatter:
    words: "Not stated."
    data_count: null
    r_squared: null
    standard_deviation: null
  advice: {words: "only approximate estimates", by: "Loehr et al. (2016), p. 8-25"}
  evaluations: []
  notes: >-
    The source calls the estimate Es, Young's modulus for elastic
    settlement; GEC 5 gives it as an "equivalent modulus" at working
    strains. It is a drained secant modulus, not the small-strain E0 from
    Vs, nor an undrained Eu; for the silt row, drained loading is hangtu's
    reading. "The definition of Es is not always consistent for the various
    correlations" (NHI-06-088, p. 5-84). The constants are in tsf, as
    NHI-06-088 gives them, converted with pint: read as ksf they would halve
    E. GEC 5's ksi form (0.056, 0.097, 0.139, 0.167) is the same factors,
    rounded. Neither source gives an N range; the lower bound (N1)60 > 0 is
    hangtu's, since a zero modulus is no estimate.
  sources:
    - cite: AASHTO (2004)
      reference: LRFD Bridge Design Specifications, with 2006 Interims
      locators: []
    - cite: Samtani & Nowatzki (2006)
      reference: Soils and Foundations Reference Manual, Vol. I, FHWA NHI-06-088
      locators: ["Table 5-16, p. 5-85", "pp. 5-83 to 5-84"]
    - cite: Loehr et al. (2016)
      reference: FHWA GEC 5, FHWA-NHI-16-072
      locators: ["Table 8-11, p. 8-26", "§8.9.1, p. 8-25"]

drained_youngs_modulus_kulhawy_mayne_1990:
  target: {column: drained_youngs_modulus, unit: kPa}
  equation: "E = C N60 pa, C = 5, 10 or 15 by soil row, pa = 100 kPa"
  inputs:
    spt_n60: {variant: "N60, N at 60 % energy, not corrected for overburden", unit: null}
  range:
    spt_n60: {greater_than: 0}
  labels: {spt_n60: "N60"}
  rows:
    sands_with_fines:
      wording: "sands with fines"
      coefficient: 5
      uscs: [SM, SC, SP-SM, SW-SM, SP-SC, SW-SC]
    clean_normally_consolidated_sands:
      wording: "clean NC sands"
      coefficient: 10
      uscs: [SP, SW]
    clean_overconsolidated_sands:
      wording: "clean OC sands"
      coefficient: 15
      uscs: [SP, SW]
  applies_to: sands, by the source's soil rows
  not_for: null
  uscs: null
  uscs_basis: >-
    Each row's groups are hangtu's reading of its wording. A USCS symbol
    doesn't say whether a sand is normally consolidated or overconsolidated,
    so the two clean rows share their groups.
  scatter:
    words: >-
      Not stated. "All attempts to date which correlate a modulus with N show
      considerable scatter" (p. 5-17).
    data_count: null
    r_squared: null
    standard_deviation: null
  advice: {words: "as a first order estimator", by: "Kulhawy & Mayne (1990), p. 5-17"}
  evaluations: []
  notes: >-
    Given "as a first order estimator", beside Fig. 5-13, "Comparative Plot
    of Drained Modulus Correlations for Sand", in the section on
    cohesionless soils: a drained, working-strain modulus, not the
    small-strain E0 from Vs, nor an undrained Eu. The source gives no N
    range; the lower bound N60 > 0 is hangtu's, since a zero modulus is no
    estimate.
  sources:
    - cite: Kulhawy & Mayne (1990)
      reference: EPRI EL-6800, Manual on Estimating Soil Properties for Foundation Design
      locators: ["Eqs. 5-26a to 5-26c, pp. 5-17 to 5-18", "Fig. 5-13, p. 5-17"]

shear_wave_velocity_imai_tonouchi_1982:
  target: {column: shear_wave_velocity, unit: m/s}
  equation: "Vs = 93.7 N60^0.31 m/s"
  inputs:
    spt_n60: {variant: "N60, Wair et al.'s 60 % form of the source's N at an assumed 67 % energy", unit: null}
  range:
    spt_n60: {greater_than: 0, at_most: 447}
  labels: {spt_n60: "N60"}
  applies_to: all soils; Holocene, Pleistocene and Tertiary, alluvium and fill, in Japan
  not_for: null
  uscs: null
  uscs_basis: None proposed; the source is for all soils.
  scatter:
    words: "n = 1654 pairs from 386 borings at 250 sites, r² = 0.75"
    data_count: 1654
    r_squared: 0.75
    standard_deviation: null
  advice: null
  evaluations: []
  notes: >-
    The source's Vs = 97.0 N^0.31 m/s is on uncorrected Japanese N. Wair et
    al. give it for N60 at an assumed 67 % energy, typical of Japanese
    practice (Seed et al. 1985), not a measured one. The range is the
    source's N, "from less than one bpf to nearly 400 bpf", at the same 67 %:
    400 × 67/60 = 447. GEC 5 Table 8-5 repeats the equation but labels it
    "Tertiary": its notes column is shifted a row against Wair et al.'s
    table, which governs. Vs is a small-strain property.
  sources:
    - cite: Imai & Tonouchi (1982)
      reference: Correlation of N value with S-wave velocity and shear modulus, Proc. 2nd European Symposium on Penetration Testing, Amsterdam, 67-72
      locators: ["pp. 67-72"]
    - cite: Wair et al. (2012)
      reference: Guidelines for Estimation of Shear Wave Velocity Profiles, PEER Report 2012/08
      locators: ["Table 4.2, Eq. (4.6), p. 28", "§4.1.3, p. 18"]

shear_wave_velocity_ohta_goto_1978:
  target: {column: shear_wave_velocity, unit: m/s}
  equation: "Vs = 82.1 N60^0.35 m/s"
  inputs:
    spt_n60: {variant: "N60, Wair et al.'s 60 % form of the source's N at an assumed 67 % energy", unit: null}
  range:
    spt_n60: {at_least: 2.23, at_most: 223}
  labels: {spt_n60: "N60"}
  applies_to: all soils; Quaternary alluvium, mostly of alluvial plains in Japan
  not_for: null
  uscs: null
  uscs_basis: None proposed; the source is for all soils.
  scatter:
    words: "r² = 0.52, on 289 pairs"
    data_count: 289
    r_squared: 0.52
    standard_deviation: null
  advice: null
  evaluations: []
  notes: >-
    The source's Vs = 85.3 N^0.35 m/s is its regression on N alone, for
    Quaternary soils, on uncorrected Japanese N. Wair et al. give it for N60
    at an assumed 67 % energy (Seed et al. 1985). The range is the source's
    N, about 2 to 200 bpf, at the same 67 %: 2.23 to 223. The Holocene and
    Pleistocene forms need a geologic age and aren't built. GEC 5 Table 8-5
    labels this equation "Holocene": its notes column is shifted a row
    against Wair et al.'s table, which governs.
  sources:
    - cite: Ohta & Goto (1978)
      reference: Empirical shear wave velocity equations in terms of characteristic soil indexes, Earthquake Engineering and Structural Dynamics, 6(2), 167-187
      locators: ["pp. 167-187"]
    - cite: Wair et al. (2012)
      reference: Guidelines for Estimation of Shear Wave Velocity Profiles, PEER Report 2012/08
      locators: ["Table 4.2, Eq. (4.3), p. 28", "§4.1.2, p. 18"]
