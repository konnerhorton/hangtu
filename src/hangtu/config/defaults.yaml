# Defaults shipped with hangtu (docs/plots/P00-framework.md §3).
# ht.settings holds the session's choices; ht.settings.reset() restores these.

settings:
  display_units: US            # "US" | "SI"
  display_overrides: {}        # {quantity kind: unit}, e.g. {stress: ksf}
  vertical_datum: null         # e.g. NAVD88; added to elevation labels
  palette: {}                  # {geology unit: color}
  figure_sizes:                # inches, by plot kind
    default: [6.5, 4.5]
    profile: [4.0, 6.5]
    grid: [3.75, 2.75]         # per panel (P07 grid)
  hints: true                  # one HangtuHint per plot call for missing optional columns
  hammer_efficiency: null      # SPT energy ratio in %, used from M3
  spt_cap: 100                 # SPT N cap, used from M3
  summary_min_count: 5         # fewest values per unit for a P07 summary bar
  geology_key: GEOL_GEOL       # GEOL heading holding each layer's code (datasets, M7)

# Plot presets (docs/plots/P01-property-profile.md §6). The preset name is the
# registry column it plots. Typical ranges are in the quantity's canonical unit
# (the % value for percent) and only set default axis limits for sparse data;
# they are never used for QC (plots README, "Presets").
presets:
  hydraulic_conductivity:
    column: hydraulic_conductivity
    label: Hydraulic conductivity, k
    quantity: hydraulic_conductivity
    log: true
    start_at_zero: false
    typical: [1.0e-11, 1.0e-2]
  undrained_shear_strength:
    column: undrained_shear_strength
    label: Undrained shear strength, s_u
    quantity: stress
    log: false
    start_at_zero: true
    typical: [0, 300]
  water_content:
    column: water_content
    label: Water content, w
    quantity: percent
    log: false
    start_at_zero: true
    typical: [0, 100]
  bulk_unit_weight:
    column: bulk_unit_weight
    label: Bulk unit weight, γ
    quantity: unit_weight
    log: false
    start_at_zero: false
    typical: [14, 23]
  # SPT (P02 §6). N is a count and never converts.
  spt_n:
    column: spt_n
    label: SPT N
    quantity: count
    log: false
    start_at_zero: true
    typical: [0, 50]
  spt_n60:
    column: spt_n60
    label: SPT N60
    quantity: count
    log: false
    start_at_zero: true
    typical: [0, 50]
  spt_n_capped:
    column: spt_n_capped
    label: SPT N (capped)
    quantity: count
    log: false
    start_at_zero: true
    typical: [0, 50]

# Quantity kinds (P00 §4.1). Units are pint expressions; text is what labels show.
# The canonical unit is what values are converted through. Kinds with no canonical
# unit are never converted and need no declared units.
quantity_kinds:
  length:
    canonical: meter
    US: {unit: foot, text: ft}
    SI: {unit: meter, text: m}
  small_length:
    canonical: millimeter
    US: {unit: inch, text: in}
    SI: {unit: millimeter, text: mm}
  particle_size:
    canonical: millimeter
    US: {unit: millimeter, text: mm}
    SI: {unit: millimeter, text: mm}
  stress:
    canonical: kilopascal
    US: {unit: force_pound / foot**2, text: psf}
    SI: {unit: kilopascal, text: kPa}
  unit_weight:
    canonical: kilonewton / meter**3
    US: {unit: force_pound / foot**3, text: pcf}
    SI: {unit: kilonewton / meter**3, text: kN/m³}
  density:
    canonical: megagram / meter**3
    US: {unit: pound / foot**3, text: pcf}
    SI: {unit: megagram / meter**3, text: Mg/m³}
  hydraulic_conductivity:
    canonical: meter / second
    US: {unit: centimeter / second, text: cm/s}
    SI: {unit: meter / second, text: m/s}
  percent:
    canonical: null
    US: {unit: null, text: "%"}
    SI: {unit: null, text: "%"}
  dimensionless:
    canonical: null
    US: {unit: null, text: null}
    SI: {unit: null, text: null}
  count:
    canonical: null
    US: {unit: null, text: null}
    SI: {unit: null, text: null}
  angle:
    canonical: degree
    US: {unit: degree, text: °}
    SI: {unit: degree, text: °}
