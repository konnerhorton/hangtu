# Minimally useful fields per group (docs/data/qc.md §4.10). A blank required
# field raises C001 (warning), a blank recommended field C002 (info). Groups not
# in the file aren't checked. Override with p.qc(min_fields=...), which replaces
# a group's required or recommended list as a whole.
#
# sample_key is the key of the sample a specimen comes from; a list that starts
# with *sample_key is read as if the key headings were written out in its place.
# SPEC_REF and SPEC_DPTH are recommended, not required (M7, datasets.md §14): a
# lab result without a specimen depth is placed at its sample (SPEC §8.2).

sample_key: &sample_key [LOCA_ID, SAMP_TOP, SAMP_REF, SAMP_TYPE, SAMP_ID]

min_fields:
  LOCA:
    required: [LOCA_ID, LOCA_GL, LOCA_FDEP]
    recommended: [LOCA_TYPE, LOCA_NATE, LOCA_NATN, LOCA_GREF, LOCA_STAR]
  GEOL:
    required: [LOCA_ID, GEOL_TOP, GEOL_BASE, GEOL_DESC]
    recommended: [GEOL_LEG, GEOL_GEOL]
  SAMP:
    required: [LOCA_ID, SAMP_TOP, SAMP_TYPE]
    recommended: [SAMP_REF, SAMP_ID, SAMP_BASE]
  ISPT:
    required: [LOCA_ID, ISPT_TOP, ISPT_NVAL]
    recommended: [ISPT_REP, ISPT_NPEN, ISPT_ERAT, ISPT_TYPE, ISPT_HAM, ISPT_WAT, ISPT_CAS,
                  ISPT_INC1, ISPT_INC2, ISPT_INC3, ISPT_INC4, ISPT_INC5, ISPT_INC6,
                  ISPT_PEN1, ISPT_PEN2, ISPT_PEN3, ISPT_PEN4, ISPT_PEN5, ISPT_PEN6]
  LLPL:
    required: [*sample_key, LLPL_LL, LLPL_PL]
    recommended: [SPEC_REF, SPEC_DPTH, LLPL_PI, LLPL_425, LLPL_PREP]
  LNMC:
    required: [*sample_key, LNMC_MC]
    recommended: [SPEC_REF, SPEC_DPTH]
  GRAG:
    required: [*sample_key]
    recommended: [SPEC_REF, SPEC_DPTH, GRAG_GRAV, GRAG_SAND, GRAG_SILT, GRAG_CLAY, GRAG_FINE, GRAG_UC]
  GRAT:
    required: [*sample_key, GRAT_SIZE, GRAT_PERP]
    recommended: [SPEC_REF, SPEC_DPTH]
  PTST:
    required: [*sample_key, PTST_K]
    recommended: [SPEC_REF, SPEC_DPTH, PTST_TYPE, PTST_COND, PTST_TSTR]
  FGHG:
    required: [LOCA_ID, FGHG_TOP, FGHG_BASE, FGHG_IPRM]
    recommended: [FGHG_TYPE]
  IPRG:
    required: [LOCA_ID, IPRG_TOP, IPRG_BASE, IPRG_IPRM]
    recommended: [IPRG_TYPE]
  LDEN:
    required: [*sample_key, LDEN_BDEN]
    recommended: [SPEC_REF, SPEC_DPTH, LDEN_DDEN, LDEN_MC, LDEN_TYPE, LDEN_COND]
  LPDN:
    required: [*sample_key, LPDN_PDEN]
    recommended: [SPEC_REF, SPEC_DPTH, LPDN_TYPE]
  IDEN:
    required: [LOCA_ID, IDEN_DPTH, IDEN_IDEN]
    recommended: [IDEN_MC, IDEN_TYPE]
  TREG:
    required: [*sample_key, TREG_TYPE]
    recommended: [SPEC_REF, SPEC_DPTH, TREG_FCR, TREG_COND]
  TRET:
    required: [*sample_key, TRET_TESN, TRET_CELL, TRET_DEVF]
    recommended: [SPEC_REF, SPEC_DPTH, TRET_PWPF, TRET_CONP, TRET_BACK, TRET_BVAL, TRET_STRN]
  TRIG:
    required: [*sample_key, TRIG_TYPE]
    recommended: [SPEC_REF, SPEC_DPTH, TRIG_COND]
  TRIT:
    required: [*sample_key, TRIT_TESN, TRIT_CELL, TRIT_DEVF]
    recommended: [SPEC_REF, SPEC_DPTH, TRIT_STRN]
