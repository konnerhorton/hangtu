name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  lowest:
    # Proves the dependency floors in pyproject.toml (SPEC §12.1).
    name: test (lowest dependency versions)
    runs-on: ubuntu-latest
    env:
      # Applies to every uv command, so `uv run` doesn't re-resolve to the newest versions.
      UV_RESOLUTION: lowest-direct
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run pytest

  docs:
    # The docs site builds with no warnings (docs/work/docs-site.md, spec §7).
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked --group docs
      - run: uv run --locked --group docs python docs/prepare_site.py
      # --strict stops on broken links; griffe's docstring warnings don't stop
      # the build, so they are failed here.
      - run: |
          uv run --locked --group docs zensical build --clean --strict 2>&1 | tee build.log
          ! grep -q "griffe:" build.log
