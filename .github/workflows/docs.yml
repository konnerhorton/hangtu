name: Docs

# Publishes the docs site to GitHub Pages from main (docs/work/docs-site.md,
# spec §7). It runs when a push changes anything the site is built from, or by
# hand. CI builds the same site on every push and pull request.
on:
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - "docs/prepare_site.py"
      - "docs/img/logo.txt"
      - "zensical.toml"
      - "src/**"
      - "examples/**"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked --group docs
      - run: uv run --locked --group docs python docs/prepare_site.py
      - run: uv run --locked --group docs zensical build --clean --strict
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/site
      - uses: actions/deploy-pages@v5
        id: deployment
